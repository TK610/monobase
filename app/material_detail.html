  'ITO':{ja:[['📱','スマートフォン','画面の透明電極として使われるよく使われる材料の一つです。'],['🖥️','ディスプレイ','液晶やタッチパネルなど、透明性と導電性の両方が必要な部分で活躍します。'],['☀️','太陽電池','光を通しながら電気を流す電極として利用されます。']],en:[['📱','Smartphones','ITO is a representative transparent electrode material used in displays.'],['🖥️','Displays','It combines transparency with electrical conductivity for touch panels and displays.'],['☀️','Solar cells','It can serve as an electrode that passes light while conducting electricity.']]},
  'CEO2':{ja:[['👓','ガラス・レンズ研磨','ガラスをきれいに仕上げる研磨材として使われます。'],['🚗','自動車の排ガス浄化','酸素を取り込んだり放したりする性質が触媒を助けます。'],['📱','精密研磨','電子・光学部品を平坦に仕上げる研磨用途があります。']],en:[['👓','Glass & lens polishing','Cerium oxide is widely used as a polishing material for glass.'],['🚗','Vehicle catalysts','Its oxygen storage and release behavior supports exhaust catalysts.'],['📱','Precision polishing','It is used in precision polishing of electronic and optical components.']]},'EL-041-NB':{ja:[["🧲","超伝導磁石","ニオブを含む合金は、MRIや研究用の超伝導磁石に利用されています。"],["✈️","耐熱合金","高温強度が求められる航空・宇宙分野の合金元素として利用されます。"]]},'EL-042-MO':{ja:[["🔥","耐熱部品","高い融点を活かし、高温炉や電子部品など高温環境の材料に使われます。"],["🔧","特殊鋼","鋼に加えることで強度や耐熱性、耐食性などを調整します。"]]},'EL-044-RU':{ja:[["💾","電子・記録材料","薄膜や電子材料、磁気記録関連などで利用される希少金属です。"],["⚗️","触媒","化学反応を助ける触媒として利用されます。"]]},'EL-045-RH':{ja:[["🚗","自動車触媒","排気ガス中の有害成分を減らす三元触媒の重要な貴金属の一つです。"],["💍","めっき","白く美しい外観と耐食性を活かし、宝飾品などの表面処理にも使われます。"]]},'EL-046-PD':{ja:[["🚗","自動車触媒","排気ガス浄化触媒として広く利用される貴金属です。"],["🔌","電子部品","電気接点や積層セラミックコンデンサなど、電子分野にも関係しています。"]]},'EL-048-CD':{ja:[["🔋","ニッケル・カドミウム電池","充電池の材料として長く利用されてきましたが、有害性から用途や廃棄には厳しい管理が必要です。"],["🛡️","特殊な表面処理","耐食性を利用しためっき用途がありますが、環境・安全上の理由から用途は限定的です。"]]},'EL-049-IN':{ja:[["📱","透明電極","ITOなどの透明導電膜として、ディスプレイやタッチパネルに広く利用されています。"],["🔬","半導体材料","InPやInGaAsなど、光通信・高速デバイスに関係する化合物半導体に使われます。"]]},'EL-050-SN':{ja:[["🥫","缶の表面","鋼板にスズをめっきしたブリキは、缶などに利用されてきました。"],["🔧","はんだ","スズを主成分とする合金は、電子部品を接合するはんだとして大切です。"]]},'EL-051-SB':{ja:[["🔥","難燃材料","三酸化アンチモンは、他の難燃成分と組み合わせて樹脂などの難燃化に利用されます。"],["🔋","鉛合金","鉛に加えて硬さや強度を調整する用途があります。"]]},'EL-052-TE':{ja:[["☀️","薄膜太陽電池","テルルを含むCdTeは、薄膜太陽電池の代表的な化合物半導体の一つです。"],["⚙️","合金添加","金属材料の加工性などを調整するため、少量添加されることがあります。"]]},'EL-053-I':{ja:[["🧴","消毒薬","ヨウ素を利用した消毒薬は、医療や家庭でも知られています。"],["🧂","栄養","ヨウ素は甲状腺ホルモンに必要な微量元素で、食品から摂取します。"]]},'EL-054-XE':{ja:[["💡","高輝度ランプ","キセノンランプは強い光を出し、映写・分析・試験装置などに利用されます。"],["🏥","医療・研究","キセノンは特殊な医療・研究用途でも利用される希ガスです。"]]},'EL-056-BA':{ja:[["🏥","X線造影","硫酸バリウムはX線を通しにくく、消化管のX線検査で造影剤として利用されます。"],["🎆","花火の緑色","バリウム化合物は、花火で緑色を出す材料として利用されます。"]]},'EL-057-LA':{ja:[["📷","光学  function everydayCard(x){
   const e=everyday[x.id]; if(!e) return '';
   const items=(e[lang]||e.ja||[]).map(v=>{
     const media=v[3]?'<div class="everyday-media"><img src="'+esc(v[3])+'" alt="'+esc(v[1])+'"></div>':'';
     return '<div class="everyday-item '+(v[3]?'has-image':'')+'">'+media+'<div class="everyday-body"><span class="everyday-emoji">'+v[0]+'</span><strong>'+esc(v[1])+'</strong><small>'+esc(v[2])+'</small></div></div>';
   }).join('');
   return '<section class="card everyday-card"><div class="everyday-head"><span class="everyday-icon">⌂</span><div><h2>'+L('身近なところでは','Everyday uses')+'</h2><p>'+L('身近な製品や場面での使われ方を紹介します。','Examples of familiar products and situations where this material is used.')+'</p></div></div><div class="everyday-grid">'+items+'</div><p class="everyday-note">'+L('※ 代表的な用途例です。製品ごとの材料構成や使用量を示すものではありません。','Representative examples only; actual material composition varies by product.')+'</p></section>';
 }


 function storyCard(x){
   const extra={'EL-002-HE':[["ヘリウムの声が高くなるのはなぜ？","ヘリウムを吸ったときに声が高く聞こえるのは、声帯そのものが急に高い音を出すからではありません。ヘリウム中では音の伝わる速さが空気中と大きく異なるため、口や喉の中で強調される音の周波数が変わり、独特の声に聞こえます。なお、ヘリウムを吸う行為には酸欠などの危険があるため、実験感覚で行うものではありません。"],["ヘリウムは宇宙では多いのに、地球では貴重？","ヘリウムは宇宙では水素に次いで多い元素ですが、地球では事情が違います。とても軽い気体なので、大気中へ出たヘリウムは最終的に宇宙空間へ逃げていきます。MRIや研究設備にも必要なため、回収や再利用が重要な資源です。"]],'EL-006-C':[["鉛筆の芯とダイヤモンドが同じ元素？","どちらも主役は炭素です。それでも、黒鉛は柔らかく電気を通し、ダイヤモンドは非常に硬いという大きな違いがあります。理由は炭素原子の並び方と結びつき方が違うからです。同じ元素でも構造が変わると性質が大きく変わる、材料科学らしい分かりやすい例です。"],["「鉛筆」なのに鉛は入っていない？","一般的な鉛筆の芯は黒鉛と粘土などから作られており、金属の鉛が芯として使われているわけではありません。黒鉛が紙へ薄く付着することで文字を書くことができます。"]],'EL-007-N':[["ポテトチップスの袋がパンパンなのは窒素？","食品の袋には窒素を封入することがあります。窒素は反応しにくいため、食品が酸素に触れて酸化するのを抑えるのに役立ちます。袋の中の気体は、食品を外からの衝撃から守るクッションの役割も果たします。"]],'EL-008-O':[["空気のほとんどは酸素……ではない？","私たちは酸素を吸って生きているので、空気の主成分も酸素だと思いがちです。しかし乾燥した空気では、酸素はおよそ21％で、最も多いのは約78％を占める窒素です。身近な空気も、実は複数の気体からできた混合物です。"]],'EL-010-NE':[["ネオンサインは全部ネオン？","街で『ネオン』と呼ばれる光る看板でも、すべてがネオンガスだけで光っているわけではありません。本来のネオンは放電すると特徴的な赤橙色に光ります。別の色はほかのガスや蛍光体などを利用して作られることがあります。"]],'EL-011-NA':[["食塩のナトリウムと金属ナトリウムは同じもの？","元素としては同じナトリウムですが、状態はまったく違います。金属ナトリウムは水と激しく反応する非常に反応性の高い金属です。一方、食塩ではナトリウムは塩化物イオンと組み合わさった安定な化合物になっています。元素は『何と、どんな状態で結びついているか』によって性質が大きく変わります。"]],'EL-012-MG':[["マグネシウムが燃えると、なぜあんなに明るい？","マグネシウムは燃焼すると非常に強い白色光を放ちます。この性質はかつて写真撮影用の閃光にも利用されました。強い光を出す一方、燃焼中のマグネシウムは高温になるため、単なる『燃えやすい金属』として扱えるものではありません。"]],'EL-013-AL':[["アルミニウムは昔、貴重な金属だった？","現在は飲料缶やアルミホイルでおなじみですが、アルミニウムはかつて金属として取り出すことが難しく、とても高価でした。19世紀に製錬技術が発達し、大量生産できるようになったことで、身近な軽金属へと変わっていきました。"],["アルミホイルは、なぜあんなに薄くできる？","アルミニウムは延性・展性があり、圧延によって非常に薄い箔にできます。薄くても金属なので光や水分などを遮りやすく、食品包装にも便利です。身近なアルミホイルは、材料の加工しやすさを実感できる製品です。"]],'EL-014-SI':[["シリコンとシリコーンは同じもの？","名前が似ていますが同じものではありません。シリコン（silicon）は元素のケイ素で、半導体の代表材料です。一方、シリコーン（silicone）はケイ素と酸素などを骨格に持つ高分子材料で、ゴム状製品やシーリング材などに使われます。日本語では特に混同しやすい言葉です。"],["砂と半導体チップはつながっている？","砂や石英に多く含まれる二酸化ケイ素にはケイ素が含まれています。半導体用シリコンは、そこから単純に砂を固めるわけではなく、高度な精製工程を経て極めて高純度にした材料です。身近な鉱物と最先端の電子機器が同じ元素でつながっています。"]],'EL-015-P':[["リンは光るから「リン」？","リンにはいくつかの同素体があり、性質も大きく異なります。白リンは空気中で酸化される際に淡く光って見えることがありますが、赤リンは性質が異なり、安全マッチなどに利用されます。同じリンでも構造によって扱い方が大きく変わります。"]],'EL-016-S':[["タイヤと硫黄にはどんな関係がある？","天然ゴムはそのままでは温度によって性質が変わりやすく、実用品として扱いにくい面があります。硫黄などを使って分子同士を結びつける『加硫』を行うことで、弾力や耐久性を高められます。タイヤの性能を支えている重要な化学技術です。"]],'EL-017-CL':[["塩素は危険なのに、水道水にも使われる？","塩素という言葉から強い毒性を持つ塩素ガスを思い浮かべるかもしれませんが、水道の消毒では管理された濃度の塩素系薬剤が利用されます。元素や化学物質の安全性は『何の物質として存在するか』『どれくらいの量か』で大きく変わります。"]],'EL-018-AR':[["アルゴンは空気の中にもいる？","アルゴンは特別な研究用ガスに見えますが、実は大気中にも約0.93％含まれています。窒素や酸素ほど多くはありませんが、身の回りの空気にも普通に存在する元素です。反応しにくい性質を利用して、溶接や薄膜製造などで活躍します。"]],'EL-019-K':[["カリウムは水に入れると激しく反応するのに、食品にもある？","食品中のカリウムは、反応性の高い金属カリウムそのものが入っているわけではありません。体内や食品では主にイオンとして存在しています。同じ元素名でも、単体金属と化合物・イオンでは性質がまったく違う分かりやすい例です。"]],'EL-020-CA':[["骨の中に金属カルシウムが入っている？","骨に含まれるカルシウムは、銀色の金属カルシウムがそのまま入っているわけではありません。主にリン酸カルシウム系の成分として存在しています。『カルシウム＝白い金属が骨に入っている』わけではないところが、元素を学ぶ面白さです。"]],'EL-022-TI':[["チタンは「軽くて強い」だけ？","チタンは鉄より軽く、比強度に優れ、海水などに対する耐食性も高い金属です。そのため航空機から眼鏡、化学設備まで幅広く使われます。ただし、材料価格や加工の難しさもあるため、何でもチタンにすればよいわけではありません。"],["チタンが医療分野で使われるのはなぜ？","チタンは体内環境でも比較的安定で、生体適合性に優れる材料として知られています。その特性を活かして、人工関節や歯科インプラントなどにも利用されています。"],["チタンは磁石につく？","一般的なチタンは、鉄のように強く磁石へ引きつけられる金属ではありません。見た目が銀白色でも、磁気的な性質は鉄とは大きく異なります。材料は色だけでは見分けられない分かりやすい例です。"],["チタンの色は銀色だけ？","チタン表面の酸化皮膜の厚さを調整すると、光の干渉によって青や紫、金色などさまざまな色に見せられます。塗料で色を付けているとは限らないところが面白い点です。"],["海の近くでチタンが活躍するのはなぜ？","チタンは海水に対する耐食性に優れるため、海水を扱う熱交換器や設備などにも利用されます。材料価格だけでなく、腐食しにくさや長寿命まで含めて材料は選ばれます。"]],'EL-024-CR':[["ステンレスは、なぜさびにくい？","ステンレス鋼には一定量以上のクロムが含まれています。表面のクロムが酸素と反応すると、非常に薄い保護膜（不動態皮膜）ができます。この膜が内部の金属を守るため、普通の鉄鋼よりもさびにくくなります。傷が付いても、酸素がある環境では膜が再形成されやすいことも大きな特徴の一つです。"],["クロムなら全部同じように安全？","元素名が同じでも、金属クロムとクロム化合物では性質が異なります。特に六価クロム化合物には強い有害性があるものがあり、厳格な管理が必要です。材料を見るときは、元素名だけでなく『どの化学状態か』まで見ることが大切です。"],["クロムめっきのピカピカは、クロムだけで作っている？","装飾用のクロムめっきでは、下地にニッケルなどのめっきを組み合わせ、その上へ薄いクロム層を形成する構成がよく使われます。見えている表面だけでは、製品を支える多層構造までは分かりません。"],["ステンレスなら絶対にさびない？","ステンレスは『さびない鉄』ではなく、普通の鋼より非常にさびにくい材料です。塩分の多い環境やすき間、表面状態など条件によっては腐食することがあります。"]],'EL-025-MN':[["乾電池の「マンガン」ってどこにいる？","マンガン乾電池やアルカリ乾電池では、二酸化マンガンが正極側の材料として使われます。名前に『マンガン』と付かないアルカリ乾電池にもマンガン化合物が使われているところは、少し意外かもしれません。"],["マンガンは鉄を作るときにも重要？","マンガンは鋼の強度や靭性などを調整するだけでなく、製鋼時にも重要な元素です。完成品では目立たなくても、鉄鋼材料を支える縁の下の力持ちです。"],["マンガンとマグネシウムは同じ？","名前が少し似ていますが、マンガン（Mn）とマグネシウム（Mg）は別の元素です。乾電池や鉄鋼で活躍するマンガンと、軽量合金などで使われるマグネシウムでは性質も用途も大きく違います。"]],'EL-026-FE':[["鉄はなぜ、さびる？","鉄が水分と酸素のある環境に置かれると、表面で電気化学的な反応が進み、酸化物や水酸化物を含むさびができます。さびは鉄の内部を十分に守る緻密な膜になりにくいため、条件がそろうと腐食がさらに進んでいきます。"],["ステンレスも鉄なの？","多くのステンレス鋼は鉄を主成分とする合金です。そこへクロムやニッケルなどを加えることで、普通の鉄鋼とは違う耐食性や加工性を持たせています。身近なスプーンから大型設備まで、同じ『鉄ベース』でも配合によって性質は大きく変わります。"],["鉄は磁石につくのに、ステンレスはつかないことがある？","ステンレス鋼は種類によって内部の結晶構造が異なります。代表的なオーステナイト系は磁石につきにくい一方、フェライト系やマルテンサイト系など磁石につく種類もあります。"],["鉄と鋼は同じもの？","日常ではまとめて『鉄』と呼ぶことがありますが、工業材料としては純粋な鉄そのものより、炭素などを含む鋼が圧倒的に多く使われています。成分や熱処理で性質を大きく変えられます。"],["鉄は地球の中にも多い？","鉄は地球全体でも非常に重要な元素で、地球の核は主に鉄とニッケルからできていると考えられています。建物に使う鉄と地球を形づくる元素が同じというのは少し不思議です。"]],'EL-027-CO':[["コバルトブルーって元素の色？","鮮やかな青色で知られる『コバルトブルー』は、金属コバルトそのものの色ではありません。コバルトを含む化合物を利用した顔料の色です。金属コバルト自体は銀白色に近く、元素と化合物で見た目が大きく変わる例です。"],["コバルトは名前の由来もちょっと変わっている？","コバルトの名称は、ドイツ語で鉱山の精霊やいたずら者を意味する『Kobold』に由来するとされています。目的の金属が得られず厄介だった鉱石の歴史が背景にあります。"],["電池のコバルトは減らす方向なの？","リチウムイオン電池ではコバルトを含む正極材料が広く使われてきましたが、資源やコストなどの観点から使用量を抑えた材料や、コバルトを使わない系統の採用も進んでいます。"]],'EL-028-NI':[["ニッケルは、なぜステンレスに入っている？","ステンレス鋼には種類がありますが、代表的なオーステナイト系ステンレスではニッケルが組織を安定させ、加工性や耐食性などに寄与します。キッチン用品で見かける『18-8』という表示は、代表的にはクロム約18％、ニッケル約8％を含むステンレスを示します。"],["ニッケルは金属アレルギーと関係する？","ニッケルはアクセサリーや金属製品にも使われますが、人によってはニッケルイオンへの接触でアレルギー性皮膚炎を起こすことがあります。肌に触れる製品では材料選定や表面処理が大切です。"],["ニッケルは磁石につく？","ニッケルは鉄やコバルトと並び、室温で強磁性を示す代表的な元素の一つです。ただしニッケルを含む合金すべてが同じ磁気特性になるわけではありません。"]],'EL-029-CU':[["銅は、なぜ電線の定番なの？","銅は電気を非常によく通すうえ、細い線へ加工しやすく、接続もしやすい金属です。銀の方が電気伝導性は高いものの、価格などを含めた実用性とのバランスから、銅が配線材料として広く使われています。"],["銅が緑色になることがあるのはなぜ？","銅や銅合金は長い時間、屋外環境にさらされると、表面に緑色系の腐食生成物ができることがあります。歴史的な銅屋根や銅像で見られる色も、この表面変化によるものです。新品の赤みを帯びた銅とは大きく印象が変わります。"],["10円玉は純銅なの？","日本の10円硬貨は純銅ではなく、銅を主成分にスズや亜鉛を含む青銅系の合金です。硬貨には強度や耐久性も必要なため、合金が使われています。"],["銅には菌を減らす性質がある？","銅や一部の銅合金の表面には、条件によって微生物の生存を抑える性質が知られています。ただし、通常の清掃や衛生管理そのものが不要になるわけではありません。"],["自由の女神が緑色なのは銅と関係ある？","自由の女神像の外装には銅板が使われています。長年屋外にさらされたことで表面に緑青を含む層が形成され、現在の特徴的な緑色になりました。"]],'EL-030-ZN':[["亜鉛めっきは、傷が付いたら終わり？","亜鉛めっきは単に鉄を覆って水や酸素を遮るだけではありません。亜鉛は鉄より先に腐食しやすいため、小さな傷で鉄が露出しても、条件によって亜鉛が先に反応して鉄を守る働きがあります。この性質を利用した防食を犠牲防食と呼びます。"],["亜鉛は人の体にも必要？","亜鉛は金属材料としてだけでなく、人体に必要な必須微量元素でもあります。多くの酵素やたんぱく質の働きに関係していますが、必要な元素だからといって多く摂ればよいわけではありません。"],["トタンと亜鉛にはどんな関係がある？","一般にトタンは、鋼板の表面へ亜鉛めっきを施した材料です。鉄の強さと亜鉛の防食作用を組み合わせた身近な材料です。"]],'EL-032-GE':[["ゲルマニウムは昔の半導体の主役？","初期のトランジスタにはゲルマニウムが使われました。その後、シリコンが製造技術や酸化膜の扱いやすさなどから半導体の主流になりましたが、ゲルマニウムは現在も赤外線光学や特殊な半導体などで活躍しています。"],["ゲルマニウムは透明なの？","可視光では不透明に見えるゲルマニウムですが、特定の赤外線領域では光を通します。そのため赤外線カメラのレンズなどに利用できます。透明か不透明かは、光の波長でも変わります。"],["健康グッズのゲルマニウムと半導体は同じ話？","ゲルマニウムは実在する半導体元素ですが、元素としての物性と、身につけるだけで特別な健康効果が得られるという主張は別の話です。科学的性質と宣伝表現は分けて考える必要があります。"]],'EL-034-SE':[["セレンは光で電気的性質が変わる？","セレンは光を受けると電気的な性質が変化する光電特性で知られています。この性質は歴史的に露出計や複写機などにも利用されました。現在は材料技術が進み用途も変化していますが、『光と電気をつなぐ元素』の一つです。"],["セレンは必要な元素なのに、有害にもなる？","セレンは人体に必要な必須微量元素ですが、過剰摂取には注意が必要です。材料や化学物質では『必要か危険か』を単純な二択で考えず、量や化学形態まで見ることが大切です。"]],'EL-035-BR':[["臭素は常温で液体の元素？","常温付近で液体として存在する元素は多くありません。臭素はその珍しい例の一つで、赤褐色の液体です。ただし単体の臭素は腐食性・毒性が強く、身近に直接触れるような物質ではありません。製品では主に化合物として利用されます。"],["臭素という名前は『におい』が由来？","臭素の英名 bromine は、悪臭を意味するギリシャ語に由来します。単体の臭素は刺激性の強い蒸気を生じるため、発見当時の特徴が元素名につながりました。"],["海水にも臭素はある？","臭素は自然界では単体としてより、臭化物イオンとして海水や塩湖などに存在します。反応性の高い単体臭素と、自然界の臭化物では状態も性質も異なります。"]],'EL-036-KR':[["クリプトンって、あの『クリプトン』？","名前からフィクションを連想する人もいますが、クリプトンは実在する元素です。空気中にごくわずかに存在する希ガスで、反応しにくい性質を持っています。名称はギリシャ語で『隠れたもの』を意味する言葉に由来します。"],["クリプトンは空気から取り出す？","クリプトンは大気中にごく微量しかありません。工業的には空気を液化して成分を分離する工程などから得られます。毎日吸っている空気には、主成分以外にも希ガスが隠れています。"]],'EL-038-SR':[["花火の赤色はどうやって作る？","花火の色は、金属元素を含む化合物が高温で特徴的な光を出す性質を利用して作られます。ストロンチウム化合物は鮮やかな赤色を出すよく使われる材料の一つです。夜空の色にも材料科学が使われています。"],["ストロンチウムと放射能は同じ話？","ストロンチウムには複数の同位体があります。自然界に存在する安定同位体と、核分裂で生じる放射性同位体のストロンチウム90は区別して考える必要があります。"],["赤い花火なら必ずストロンチウム？","ストロンチウム化合物は赤色を作る代表材料ですが、実際の花火は色調や燃焼特性を整えるため複数の材料を組み合わせます。"]],'EL-039-Y':[["イットリウムの名前は、ある村から生まれた？","イットリウムの名前は、スウェーデンのイッテルビー村に由来します。この小さな村に関係する鉱物から複数の希土類元素が見つかり、イットリウム以外にもテルビウム、エルビウム、イッテルビウムなどの名前につながりました。元素の歴史ではとても有名な場所です。"],["イットリウムはレアアースなの？","イットリウムはランタノイドそのものではありませんが、化学的性質や産出状況などから、一般に希土類元素（レアアース）の一つとして扱われます。"],["白色LEDにもイットリウムが関係する？","白色LEDの方式の一つでは青色LEDと蛍光体を組み合わせて白色を作ります。その代表的な蛍光体として、イットリウムを含むYAG系材料が利用されてきました。"]],'EL-040-ZR':[["ジルコニアとジルコニウムは同じ？","ジルコニウムは金属元素で、ジルコニアはその酸化物である二酸化ジルコニウムです。名前は似ていますが、金属とセラミックスという違いがあります。白く硬いジルコニアは歯科材料や装飾品などにも使われています。"],["ジルコニウムは燃えにくい金属？","大きな金属塊の印象だけでは判断できません。ジルコニウムは細かい粉末など表面積が大きい状態では発火・燃焼の危険性が高まります。同じ材料でも形状でリスクが変わります。"],["キュービックジルコニアはダイヤモンド？","キュービックジルコニアはダイヤモンドではなく、結晶構造を安定化した二酸化ジルコニウム系の人工材料です。炭素からできたダイヤモンドとは組成がまったく異なります。"]],'EL-041-NB':[["ニオブはMRIの中で何をしている？","MRIでは非常に強い磁場が必要です。代表的な装置ではニオブ・チタン合金の超伝導コイルが使われ、極低温まで冷やすことで電気抵抗がほぼゼロの状態を利用します。"],["ニオブを少し加えるだけで鋼が変わる？","ニオブは鋼へ少量添加するだけでも結晶粒や析出物を制御し、強度を高める効果があります。大量に入れなくても材料特性へ大きく効く元素の一つです。"],["ニオブは超伝導だけの材料？","ニオブは超伝導材料として有名ですが、鉄鋼への微量添加や耐熱合金、電子材料などにも使われます。用途によって『主役』にも『少量で効く添加元素』にもなる金属です。"],["ニオブはさびにくい？","ニオブは表面に安定した酸化皮膜を作りやすく、耐食性に優れます。このため化学装置や特殊用途でも注目されます。"]],'EL-042-MO':[["モリブデンはなぜ高温に強い？","モリブデンの融点は約2623℃と非常に高く、高温でも強度を保ちやすい金属です。そのため高温炉の部品や耐熱材料などで活躍します。"],["ステンレスにもモリブデンが入る？","海水など厳しい腐食環境向けのステンレス鋼には、モリブデンを含む種類があります。特に塩化物環境での局部腐食への抵抗性を高める目的で大切です。"],["モリブデンは生き物にも必要？","モリブデンは工業材料としてだけでなく、人を含む生物に必要な微量元素でもあります。特定の酵素の働きに関係しますが、必要量はごくわずかです。"],["モリブデンの名前は『鉛』と勘違いされたことが由来？","モリブデン鉱物は昔、鉛鉱石や黒鉛と混同されていました。名称はギリシャ語で鉛を意味する言葉に由来するとされ、材料を見分ける技術の歴史も感じられます。"]],'EL-043-TC':[["テクネチウムは『人工的に作られた元素』？","テクネチウムは、人工的に作られたことが最初に確認された元素として知られています。名前もギリシャ語の『人工の』に由来します。現在では自然界にもごく微量存在することが分かっています。"],["病院でもテクネチウムが使われる？","放射性同位体のテクネチウム99mは、核医学検査で広く利用されています。比較的短い半減期と検出しやすいガンマ線を利用して、体内の状態を画像化します。"],["テクネチウムには安定同位体がない？","テクネチウムには安定同位体が存在せず、知られている同位体はすべて放射性です。そのため地球上に大量には残りにくく、周期表の中でも特徴的な元素です。"],["なぜテクネチウム99mは検査に向いている？","テクネチウム99mは半減期が約6時間と比較的短く、画像検出に適したガンマ線を放出します。診断に必要な時間と放射線管理のバランスから核医学で重要になりました。"]],'EL-044-RU':[["ルテニウムの名前は国名が由来？","ルテニウムの名称は、ラテン語でロシア地域を指すRutheniaに由来します。元素名には人物や地名、神話などさまざまな由来があります。"],["ほんの少しで材料を硬くできる？","ルテニウムは白金族金属の一つで、白金やパラジウムなどへ加えて硬さや耐摩耗性を調整する用途があります。"],["ルテニウムは電子機器にも入っている？","ルテニウムやその化合物は、抵抗材料や電極、薄膜など電子部品のさまざまな領域で利用されます。目に見えないほど薄い層でも重要な働きをします。"],["ルテニウムは白金より硬い？","ルテニウムは硬く、白金族金属の中でも耐摩耗性を活かせる元素です。他の貴金属へ少量加えて機械的性質を調整することもあります。"]],'EL-045-RH':[["ロジウムはなぜ高価になりやすい？","ロジウムは地殻中の存在量が非常に少なく、主に他の白金族金属を精製する過程で得られます。自動車触媒などで需要が大きく変動するため、市場価格が大きく動くことでも知られています。"],["指輪の白い輝きにもロジウム？","ホワイトゴールドや銀製品などでは、表面をロジウムめっきして白い光沢や耐変色性を持たせることがあります。見えている色が母材そのものとは限りません。"],["ロジウムは銀より反射しやすい？","ロジウムは可視光をよく反射し、変色しにくい白色系の金属です。そのため装飾めっきだけでなく、反射面など特殊な光学用途にも使われます。"],["自動車触媒では何を減らしている？","三元触媒では白金族金属が役割を分担します。ロジウムは特に窒素酸化物を窒素へ還元する反応で重要な働きをします。"]],'EL-046-PD':[["パラジウムは水素を吸い込む？","パラジウムは水素を内部へ取り込みやすいことで有名です。この特性は水素の精製・分離やセンサーなどの研究・技術にも利用されています。"],["パラジウムも白金の仲間？","パラジウムは白金、ロジウム、ルテニウムなどと同じ白金族元素です。化学的に安定で触媒性能にも優れるため、自動車や化学産業で大切です。"],["パラジウムは宝飾品にも使われる？","パラジウムは白い光沢と耐食性を持ち、宝飾品や歯科材料などにも利用されてきました。ホワイトゴールドの合金元素として使われる場合もあります。"],["水素だけを通す膜が作れる？","パラジウム系の薄膜は水素を選択的に透過させる性質を利用でき、高純度水素の精製技術などに使われます。金属の膜がガスを選び分ける興味深い例です。"]],'EL-047-AG':[["電気を一番よく通す金属は銅？","実は常温付近で金属の中でも特に高い電気伝導性を持つのは銀です。それでも配線の主役が銅なのは、価格や資源量、実用性を含めたバランスが優れているためです。"],["銀製品が黒くなるのは『さび』？","銀が黒く変色する主な原因の一つは、空気中の硫黄化合物などと反応して硫化銀が表面にできることです。鉄の赤さびとは異なる反応です。"],["銀には抗菌性がある？","銀イオンには微生物の増殖を抑える作用が知られ、抗菌材料などに利用されます。ただし、銀を含めばどんな条件でも同じ効果が得られるわけではありません。"],["銀はなぜ鏡にも使われる？","銀は可視光に対する反射率が非常に高く、鏡や光学部品の反射膜に利用されます。家庭用の鏡では保護層と組み合わせ、反射金属が直接触れない構造になっているものがあります。"],["純銀は意外と柔らかい？","純銀は比較的柔らかいため、装飾品では銅などを加えた銀合金がよく使われます。純度を下げることが単なるコスト削減ではなく、使いやすい強度を得る目的の場合もあります。"],["銀メダルは全部純銀？","競技大会などの銀メダルは、必ずしも純銀だけで作られているとは限りません。大会ごとに材質や純度の規定があり、『銀色＝純銀』とは限らない分かりやすい例です。"]],'EL-048-CD':[["カドミウムはなぜ厳しく管理される？","カドミウムは人体や環境への有害性が知られており、製品への使用や排出が厳しく規制されています。材料として有用な性質があっても、安全性や環境影響によって用途が大きく変わる例です。"],["イタイイタイ病とカドミウムの関係は？","日本の四大公害病の一つであるイタイイタイ病は、鉱山由来のカドミウムによる環境汚染が原因とされています。材料を扱う技術では性能だけでなく、環境管理も重要だと分かる歴史的事例です。"],["ニカド電池は今も使われている？","ニッケル・カドミウム電池は丈夫で大きな電流を取り出しやすい特徴がありますが、カドミウムの環境負荷から一般用途では他方式への置き換えが進みました。一方、特性が必要な限定用途では利用例があります。"],["カドミウムは色材にも使われた？","カドミウム化合物には鮮やかな黄・赤色を示すものがあり、顔料として使われてきました。ただし有害性への配慮から、現在は用途制限や代替材料への移行が進んでいます。"]],'EL-049-IN':[["透明なのに電気を通せる？","インジウムを含むITOは、薄膜にすると可視光を比較的よく通しながら電気も流せます。この『透明＋導電』という組み合わせが、液晶ディスプレイやタッチパネルを支えています。"],["インジウムは柔らかい？","金属インジウムは非常に柔らかく、爪で傷を付けられるほどです。融点も約157℃と低く、見た目が普通の銀白色金属でも機械的性質は大きく異なります。"],["スマホの画面にインジウムがいる？","多くのディスプレイやタッチパネルでは、インジウムを含むITO透明導電膜が使われてきました。画面の向こう側で、光を通しながら電気を流す薄膜が働いています。"],["インジウムを曲げると音がする？","高純度のインジウムを曲げると、結晶内部の変形に伴って独特の音が聞こえることがあります。スズで知られる『スズ鳴き』に似た現象です。"]],'EL-050-SN':[["『缶』なのにスズそのものではない？","いわゆるブリキ缶は、主に鋼板の表面へ薄くスズをめっきしたものです。中身までスズで作るのではなく、鉄の強度とスズの耐食性を組み合わせています。"],["昔のはんだには鉛が入っていた？","従来の電子用はんだにはスズと鉛の合金が広く使われました。環境規制の進展により、現在はスズを主成分とした鉛フリーはんだが広く利用されています。"],["スズが寒さでボロボロになることがある？","スズには複数の結晶構造があり、低温では金属的な白色スズから粉状になりやすい灰色スズへ変化することがあります。この現象は『スズペスト』と呼ばれます。"],["スズを曲げると音がする？","高純度のスズ棒を曲げると『キュッ』というような音が聞こえることがあります。結晶内部で双晶変形が起こることに関係し、『スズ鳴き』と呼ばれます。"],["青銅にもスズが入っている？","代表的な青銅は銅とスズを主成分とする合金です。銅へスズを加えることで硬さや鋳造性などが変わり、古代から道具や像、鐘などに使われてきました。"]],'EL-051-SB':[["アンチモンの元素記号がSbなのはなぜ？","アンチモンの元素記号Sbは、ラテン語名のstibiumに由来します。英語名antimonyの頭文字とは一致しないため、周期表で少し不思議に見える元素です。"],["鉛を硬くするためにも使われる？","純粋な鉛は非常に柔らかい金属ですが、アンチモンを加えることで硬さや機械的強度を高められます。合金化で性質が大きく変わる分かりやすい例です。"],["アンチモンは半導体にも関係する？","アンチモンはシリコンなどへ微量添加するドーパントとして利用されるほか、InSbなどの化合物半導体にも使われます。古くから知られる元素ですが先端電子材料にも登場します。"],["アンチモンは昔から使われていた？","アンチモン化合物は古代から顔料や化粧用途などで知られていました。現在の安全基準とは異なる時代から、人類と長い関わりを持つ元素です。"]],'EL-052-TE':[["テルルは太陽光発電にも使われる？","テルルとカドミウムからなるCdTeは、薄膜太陽電池に利用される代表的な化合物半導体です。シリコンだけが太陽電池材料ではありません。"],["テルルの名前は『地球』が由来？","テルルの名称は、ラテン語で地球を意味するtellusに由来します。ちなみに隣のセレンは月に由来する名前で、周期表の近くに『地球と月』が並んでいます。"],["テルルは金属？それとも非金属？","テルルは金属と非金属の中間的な性質を示す半金属として扱われることがあります。周期表では位置によって性質が少しずつ変わっていくことを感じやすい元素です。"],["テルルは熱を電気に変える材料にも？","テルルを含むビスマステルル系材料は代表的な熱電材料です。温度差から電圧を生み出したり、逆に電流で温度差を作ったりする技術に利用されます。"]],'EL-053-I':[["ヨウ素の蒸気は紫色？","固体のヨウ素は黒紫色に近い外観ですが、加熱すると特徴的な紫色の蒸気が見られます。元素名も紫色を意味するギリシャ語に由来します。"],["ヨウ素は体のどこで重要？","ヨウ素は甲状腺ホルモンを作るために必要な微量元素です。海藻などに多く含まれますが、必要量を大きく超える摂取にも注意が必要です。"],["消毒薬の茶色はヨウ素？","ヨウ素を利用した消毒薬では、ヨウ素種に由来する褐色が特徴的です。ただし製剤は単体ヨウ素だけではなく、使いやすさや安定性を考えた化学的な工夫がされています。"],["ヨードチンキの『ヨード』はヨウ素？","はい、ヨードはヨウ素を表す呼び方です。日本語名と古くから使われる名称が異なるため、薬品名では『ヨード』という言葉を目にすることがあります。"],["海藻にヨウ素が多いのはなぜ？","一部の海藻は海水中のヨウ化物などを濃縮する性質を持っています。そのため昆布などはヨウ素を多く含む食品として知られています。"]],'EL-054-XE':[["キセノンは『反応しないガス』なのに化合物を作る？","希ガスは反応しにくいことで知られますが、キセノンにはフッ素や酸素などとの化合物が存在します。『希ガスは絶対に化合物を作らない』という昔の常識を変えた元素の一つです。"],["キセノンは宇宙船を動かす？","人工衛星や宇宙探査機のイオンエンジンでは、推進剤としてキセノンがよく使われます。原子をイオン化して電場で高速に加速し、わずかな力を長時間生み出します。"],["キセノンの名前も『よそ者』が由来？","キセノンの名称は、ギリシャ語で『異質なもの』『よそ者』を意味する言葉に由来します。希ガスの名前には発見時の特徴を反映したものが多くあります。"],["車の『キセノンライト』って何？","HIDヘッドランプでは始動時などにキセノンガスを利用する方式があり、一般にキセノンライトと呼ばれてきました。現在はLED化も進んでいます。"]],'EL-055-CS':[["1秒を決めるのにセシウムが使われる？","現在のSIにおける秒の定義は、セシウム133原子の特定の遷移周波数を基準にしています。スマートフォンや通信、GPSを支える正確な時刻の根本には原子の性質があります。"],["セシウムは水と激しく反応する？","金属セシウムはアルカリ金属で非常に反応性が高く、水と激しく反応します。身近に単体金属として触れる材料ではなく、厳密な管理が必要です。"],["セシウムは金色っぽい金属？","多くの金属は銀白色ですが、セシウムは淡い金色を帯びた外観を持つ珍しい金属です。ただし非常に反応性が高く、空気中で気軽に観察できる材料ではありません。"],["原子時計はずっと狂わない？","セシウム原子時計は極めて高精度ですが、装置として完全に誤差ゼロという意味ではありません。原子の一定した周波数を基準にすることで、機械式や水晶時計とは桁違いの精度を実現します。"]],'EL-056-BA':[["X線検査で飲む『バリウム』は金属バリウム？","検査で使われるのは金属バリウムではなく、非常に溶けにくい硫酸バリウムです。反応性の高い金属単体とは性質が大きく異なります。同じ元素を含んでも化合物で性質は変わります。"],["緑色の花火とバリウムの関係は？","バリウム化合物は炎の中で特徴的な緑色を示すため、花火の着色材料として利用されます。ストロンチウムの赤色と同じく、元素特有の発光を利用しています。"],["バリウムという名前は『重い』が由来？","バリウムの名称は、ギリシャ語で『重い』を意味する言葉に由来します。バリウムを含む鉱物が重いことから名付けられました。"],["同じバリウムでも毒性は同じ？","水に溶けやすいバリウム化合物には有害なものがありますが、X線造影に使われる硫酸バリウムは非常に溶けにくい物質です。元素名だけで安全性を判断できない分かりやすい例です。"]],'EL-057-LA':[["ランタンの名前は『隠れている』？","ランタンの名称は、ギリシャ語で『隠れている』という意味の言葉に由来します。セリウム化合物の中に隠れていた新しい元素として発見されたことが背景です。"],["カメラのレンズにもレアアース？","ランタンを含む光学ガラスは、高い屈折率と分散特性を利用して高性能レンズに使われます。レアアースは磁石だけでなく、光学技術にも大切です。"],["ランタンは本当に『レア』なの？","レアアースという名前から極端に少ない印象を受けますが、ランタンなど一部の希土類元素は地殻中に比較的広く存在します。難しさは濃集した鉱床や元素同士の分離にもあります。"],["ランタンは水素をためる材料にも？","ランタンを含む合金には水素を吸蔵できるものがあり、ニッケル水素電池の負極材料などに利用されています。金属の中へ水素を出し入れする性質を利用しています。"]],'EL-058-CE':[["ライターの火花にもセリウム？","ライターなどの発火石には、セリウムを含むフェロセリウム合金が使われます。削られた微粒子が発火しやすい性質を利用して火花を作ります。"],["ガラスを磨く粉にもレアアース？","酸化セリウムはガラス研磨材として非常に大切です。単に硬い粒で削るだけでなく、ガラス表面との化学的な作用も関係して高い研磨性能を発揮します。"],["セリウムはレアアースの中では多い？","セリウムは希土類元素の中では比較的存在量が多い元素です。『レアアース』という呼び名が、そのまま地殻中の少なさを意味するわけではありません。"],["セリウムはなぜガラスをきれいに磨ける？","酸化セリウム研磨では、粒子による機械的な作用に加えてガラス表面との化学的な相互作用も関係します。そのため光学ガラスなどの精密研磨で長く利用されています。"],["セリウムは酸素を出し入れできる？","酸化セリウムはCe³⁺とCe⁴⁺の状態を取りやすく、酸素を蓄えたり放出したりする能力があります。この性質が自動車排ガス触媒の性能を助けます。"]],'EL-059-PR':[["プラセオジムの名前は『緑の双子』？","名称はギリシャ語の『緑』と『双子』に由来します。かつて一つの元素と考えられていたジジミウムが、プラセオジムとネオジムに分離された歴史に関係しています。"],["溶接用ゴーグルにも関係する？","プラセオジムやネオジムを含む特殊ガラスは、特定波長の強い光を吸収する性質を利用して、ガラス加工や溶接関連の保護フィルターなどに用いられることがあります。"],["プラセオジムは磁石の耐熱性にも関係する？","ネオジム磁石では、ネオジムの一部をプラセオジムなどで置き換えた材料も利用されます。磁気特性や製造条件を調整するため、複数の希土類元素が組み合わされます。"],["プラセオジムはどんな色？","金属プラセオジムは銀白色ですが、化合物では黄緑色など特徴的な色を示すものがあります。元素単体と化合物で見た目が変わる例です。"]],'EL-060-ND':[["ネオジム磁石はなぜこんなに強い？","代表的なネオジム磁石はネオジム・鉄・ホウ素を主成分とするNd-Fe-B磁石です。結晶が強い磁気異方性を持つため、小型でも非常に強い磁力を得られます。"],["強い磁石にも弱点がある？","ネオジム磁石は非常に強力ですが、高温で磁力が低下しやすく、腐食にも注意が必要です。そのため組成調整や表面処理など、用途に合わせた工夫が行われます。"],["イヤホンが小さくできる理由の一つ？","強力なネオジム磁石を使うことで、小さな磁石でも十分な磁気回路を作りやすくなります。小型スピーカーやイヤホンの高性能化を支える材料の一つです。"],["ネオジムという名前は『新しい双子』？","ネオジムの名称はギリシャ語の『新しい』と『双子』に由来します。プラセオジムと同じく、かつて一つと考えられていたジジミウムから分離された歴史があります。"],["ネオジム磁石はそのまま裸で使う？","Nd-Fe-B磁石は腐食しやすいため、ニッケルめっきや樹脂コーティングなどの表面処理を施して使うことが一般的です。強い磁力だけで製品性能が決まるわけではありません。"],["モーターでレアアースを使わない選択肢もある？","高性能モーターにはネオジム磁石が有力ですが、誘導モーターやリラクタンスモーターなど永久磁石を使わない方式もあります。用途・効率・コスト・資源リスクを考えて方式が選ばれます。"]],'EL-061-PM':[["プロメチウムは自然界にほとんどない？","プロメチウムには安定同位体がなく、地球上ではウランの核分裂などによってごく微量生じます。まとまった量は主に人工的に得られます。"],["名前はギリシャ神話のプロメテウス？","プロメチウムの名称は、人類に火を与えたとされるギリシャ神話のプロメテウスに由来します。原子力によって得られた元素の発見を象徴する名前です。"],["光る塗料にも使われたことがある？","放射性同位体が出すエネルギーを蛍光体と組み合わせる発光用途に利用された例があります。現在は放射線管理が必要な特殊用途です。"]],'EL-062-SM':[["ネオジム磁石よりサマリウム磁石が向く場所もある？","サマリウム・コバルト磁石はネオジム磁石ほど最大磁力が高くない場合がありますが、高温で磁力が低下しにくく耐食性にも優れます。使用環境で磁石を選ぶ必要があります。"],["サマリウムの名前は人ではなく鉱物から？","サマリウムは鉱物サマルスキー石に由来します。その鉱物名は人物名に由来するため、間接的に人名から名付けられた元素でもあります。"],["原子炉でもサマリウムが重要？","サマリウム149は中性子を非常によく吸収します。原子炉では核分裂生成物として生じ、炉の反応度へ影響する元素として大切です。"]],'EL-063-EU':[["ユウロピウムの名前はヨーロッパ？","その通りで、ユウロピウムはEuropeに由来して名付けられました。地名や地域名から付いた元素の一つです。"],["赤い色を作るのが得意？","ユウロピウムイオンは鮮やかな赤色発光を示すものがあり、テレビやディスプレイ、蛍光体技術の発展を支えてきました。"],["紙幣が紫外線で光るのにも関係する？","ユウロピウムを含む発光材料は、通常光では目立ちにくく特定の光で発光させられるため、偽造防止技術にも適しています。"]],'EL-064-GD':[["MRIの造影剤は金属ガドリニウムをそのまま入れる？","いいえ、金属ガドリニウムそのものではありません。通常はガドリニウムイオンを安定な錯体にした造影剤が使われます。元素と実際の医薬品を区別することが大切です。"],["ガドリニウムは磁石に強く反応する？","ガドリニウムは室温付近にキュリー温度があり、温度によって磁気的性質が大きく変わる興味深い元素です。"],["名前は化学者ガドリンから？","ガドリニウムはフィンランドの化学者ヨハン・ガドリンにちなむ名称です。希土類研究の歴史と深く関係しています。"]],'EL-065-TB':[["テルビウムもイッテルビー村と関係する？","テルビウムはスウェーデンのイッテルビー村に由来する元素の一つです。同じ村からイットリウム、エルビウム、イッテルビウムの名前も生まれました。"],["磁石で形が変わる材料にも使う？","テルビウム・ジスプロシウム・鉄からなるTerfenol-Dは、磁場で寸法が変化する巨大磁歪材料として知られ、アクチュエータやセンサーなどに利用されます。"]],'EL-066-DY':[["ジスプロシウムの名前は『手に入りにくい』？","名称はギリシャ語で『得るのが難しい』という意味に由来します。分離が非常に難しかったことが、そのまま元素名になりました。"],["ネオジム磁石に入れると何が変わる？","ジスプロシウムを適切に加えると高温で磁石が減磁しにくくなるため、モーターなどで利用されてきました。ただし希少で高価なため使用量削減も重要な技術課題です。"],["磁石の性能は強さだけではない？","モーターでは最大磁力だけでなく、温度が上がったときに磁力を保てるかも大切です。ジスプロシウムは『耐熱性』という別の性能軸を理解しやすい元素です。"]],'EL-067-HO':[["ホルミウムは非常に強い磁気モーメントを持つ？","ホルミウムは元素の中でも非常に大きな磁気モーメントを持つことで知られ、低温物理や磁性研究で興味深い存在です。"],["名前はストックホルムから？","ホルミウムはストックホルムのラテン語名Holmiaに由来します。元素名には都市名が使われる例もあります。"],["医療レーザーでは何に使われる？","Ho:YAGレーザーは水に吸収されやすい波長の光を出し、泌尿器科などで結石破砕や組織処置に利用されています。"]],'EL-068-ER':[["インターネットを遠くまで届ける元素？","長距離光通信では光信号が弱くなります。エルビウム添加光ファイバー増幅器は、電気信号へ変換せず光のまま増幅でき、現代の通信網を支えています。"],["エルビウムもイッテルビー由来？","はい、エルビウムもスウェーデンのイッテルビー村から名付けられました。一つの小さな村が周期表に複数の名前を残しています。"],["ピンク色のガラスを作れる？","エルビウムイオンを含むガラスは淡いピンク色を示すことがあります。光通信の材料と装飾的な色材が同じ元素につながっています。"]],'EL-069-TM':[["ツリウムはレアアースの中でも珍しい？","ツリウムは天然に存在するランタノイドの中でも存在量が少ない元素の一つです。そのため一般的な日用品で大量に使われる材料ではありません。"],["名前の由来は北欧の伝説の土地？","ツリウムは古代に北方の土地を指したThuleに由来します。北欧と結び付いた元素名です。"],["レーザーではなぜ注目される？","ツリウム添加レーザーは約2µm付近の赤外光を発生でき、水への吸収特性などを利用して医療・センシング分野で研究・利用されています。"]],'EL-070-YB':[["イッテルビウムもイッテルビー村？","その通りです。イッテルビウムはイッテルビー村に由来します。この村は元素名の世界では驚くほど存在感があります。"],["金属を切るレーザーにもレアアース？","高出力ファイバーレーザーではイッテルビウムを添加した光ファイバーが増幅媒体として広く使われます。自動車や工場のレーザー加工にもつながる元素です。"],["次世代の『1秒』候補にもなる？","イッテルビウムを利用する光格子時計は、現在のセシウム原子時計を上回る精度を目指す研究の有力候補の一つです。"]],'EL-071-LU':[["ルテチウムはランタノイドの最後？","一般的な周期表ではルテチウムは原子番号71でランタノイド系列の末尾に置かれます。ただし周期表上の族の扱いには表記上の議論もあります。"],["名前はパリの古い呼び名？","ルテチウムはパリの古代ローマ時代の名称Lutetiaに由来します。都市の歴史が元素名に残っています。"],["がん治療にもルテチウム？","放射性同位体ルテチウム177は、標的分子と組み合わせて特定の腫瘍へ放射線を届ける核医学治療に利用されています。"]],'EL-072-HF':[["ハフニウムはジルコニウムとそっくり？","ハフニウムとジルコニウムは化学的性質が非常によく似ており、天然鉱物でも一緒に存在します。そのため両者を高純度に分離するのは難しい技術です。"],["半導体が小さくなるとハフニウムが登場した？","トランジスタの微細化で従来の二酸化シリコン絶縁膜を薄くしすぎると漏れ電流が問題になります。高誘電率の酸化ハフニウム系材料は、その課題を抑えるため先端半導体に導入されました。"],["名前はコペンハーゲン？","ハフニウムはコペンハーゲンのラテン語名Hafniaに由来します。発見地にちなんだ名称です。"]],'EL-073-TA':[["スマホの中にタンタルがある？","タンタルコンデンサは小型で安定した特性を得やすく、スマートフォンなど電子機器の回路に使われてきました。外から見えなくても重要な材料の一つです。"],["タンタルは酸に強い？","タンタルは非常に安定した酸化皮膜を作り、多くの腐食環境に強い金属です。この耐食性が化学装置や医療分野でも活かされます。"],["名前はギリシャ神話のタンタロス？","タンタルの名称はギリシャ神話のタンタロスに由来します。酸に浸しても反応しにくい性質を、神話の物語になぞらえたとされています。"]],'EL-074-W':[["元素記号がTではなくWなのはなぜ？","タングステンの元素記号Wは、別名Wolframに由来します。英語名Tungstenとは頭文字が一致しないため、初めて周期表を見ると不思議な元素です。"],["金属で最も融点が高い？","タングステンは純金属の中で最も高い融点を持つことで知られ、約3422℃です。この性質が高温部品や電球フィラメントに活かされました。"],["超硬工具はタングステン金属そのもの？","代表的な超硬合金は、非常に硬い炭化タングステン粒子をコバルトなどの金属で結合した複合材料です。単体タングステンとは異なる材料設計です。"],["タングステンはとても重い？","タングステンの密度は約19.3g/cm³で金とほぼ同程度です。小さな体積でもずっしり重く、高密度が必要な用途にも使われます。"]],'EL-075-RE':[["レニウムは非常に希少？","レニウムは地殻中の存在量が非常に少ない元素の一つです。主にモリブデン鉱石などを処理する過程の副産物として回収されます。"],["ジェットエンジンになぜレニウム？","高温で使うニッケル基超合金へレニウムを添加すると、クリープ強度などを改善できます。少量の希少元素が航空機エンジンの高温性能を支えます。"],["名前はライン川から？","レニウムの名称はライン川のラテン語名Rhenusに由来します。地理にちなんだ元素名の一つです。"]],'EL-076-OS':[["オスミウムはものすごく重い？","オスミウムは密度が約22.6g/cm³で、最も密度の高い元素としてイリジウムと並んで知られます。小さな塊でも非常に重く感じる金属です。"],["名前は『におい』が由来？","オスミウムの名称はギリシャ語で『におい』を意味する言葉に由来します。これは揮発性で有毒な四酸化オスミウムの強い臭いに関係しています。"],["金属オスミウムなら安全？","金属状態と化合物では危険性が大きく異なります。特に四酸化オスミウムは揮発性があり非常に有毒なため、専門的な管理が必要です。"]],'EL-077-IR':[["イリジウムは腐食にとても強い？","イリジウムは非常に耐食性の高い金属として知られ、厳しい化学環境や高温用途で価値があります。一方で希少で加工も容易ではありません。"],["恐竜絶滅の研究とイリジウム？","約6600万年前の地層にはイリジウムが異常に多い層が世界各地で見つかっています。地球表面では希少なイリジウムが隕石には比較的多いことが、巨大天体衝突説の重要な証拠の一つになりました。"],["名前は虹の女神から？","イリジウムは多彩な色を示す化合物が知られ、ギリシャ神話の虹の女神Irisにちなんで名付けられました。"]],'EL-078-PT':[["白金と『ホワイトゴールド』は同じ？","白金（プラチナ）は元素Ptですが、ホワイトゴールドは金を主成分に別の金属を加えた合金です。見た目が似ていても材料としては別物です。"],["プラチナはなぜ触媒として優秀？","白金表面では水素や酸素などの分子が吸着して反応しやすくなります。自動車触媒や燃料電池など、反応速度を高める『表面』の働きが大切です。"],["白金は金より重い？","白金の密度は約21.45g/cm³で、金の約19.3g/cm³より高密度です。同じ大きさなら白金の方が重く感じます。"],["プラチナは絶対に変色しない？","白金は非常に化学的に安定ですが、宝飾品は合金として使われることが多く、表面の傷や付着物で見え方が変わることがあります。『腐食しにくい』と『新品の輝きが永遠』は別です。"]],'EL-079-AU':[["金はなぜ何千年たっても残る？","金は酸化や腐食を受けにくい非常に安定な金属です。そのため古代の金製品が長い年月を経ても金色の輝きを残している例があります。"],["金は電気を一番よく通す？","電気伝導性だけなら銀や銅の方が高いですが、金は表面が酸化・腐食しにくいため、長期間安定した接触が必要な電子端子に向いています。"],["金1グラムはどれくらい薄くできる？","金は非常に延性・展性に優れ、極めて薄い金箔や細い線に加工できます。金箔が向こう側の光をわずかに通すほど薄くできるのも、この性質のおかげです。"],["金は宇宙から来た？","金のような重い元素は、恒星内部の通常の核融合だけでは十分に作れません。中性子星合体など非常に激しい宇宙現象が生成源として重要だと考えられています。私たちが手にする金も宇宙の歴史につながっています。"]],'EL-080-HG':[["水銀はなぜ常温で液体？","水銀は金属なのに常温で液体という珍しい元素です。原子間の金属結合が他の多くの金属ほど強くないことに、相対論的効果を含む電子構造が関係すると説明されています。"],["水銀に金を入れるとどうなる？","水銀は金や銀などとアマルガムと呼ばれる合金を作ります。この性質は歴史的に金の抽出などにも利用されましたが、水銀の毒性による深刻な環境・健康問題があるため適切な管理が不可欠です。"],["水俣病と水銀の関係は？","水俣病は工場排水に含まれたメチル水銀による環境汚染を原因とする重大な公害病です。元素としての水銀だけでなく、化学形態と環境中での移行・濃縮を理解する重要性を示す歴史的事例です。"],["『水銀＝全部同じ毒性』ではない？","金属水銀、無機水銀化合物、有機水銀化合物では体内への取り込まれ方や毒性が異なります。ただし、いずれも安易に扱える物質ではなく、用途に応じた厳格な安全・環境管理が必要です。"]],'EL-081-TL':[["タリウムは昔、殺鼠剤にも使われた？","タリウム化合物は強い毒性を持つため、かつて殺鼠剤などに使われた歴史があります。現在は厳しく管理され、身近に扱う物質ではありません。"],["タリウムの名前は緑色の光から？","タリウムは炎色・分光観察で特徴的な緑色のスペクトル線を示します。名称はギリシャ語で『緑の若枝』を意味する言葉に由来します。"],["見た目だけでは危険性は分からない？","金属タリウムは銀白色で、一見すると普通の金属に見えます。しかし毒性が高く、材料の安全性は外観だけでは判断できないことを示す元素です。"]],'EL-082-PB':[["鉛はなぜ放射線を遮るのに使われる？","鉛は密度が高く原子番号も大きいため、X線やガンマ線を弱める遮蔽材として利用されます。ただし放射線の種類やエネルギーによって適切な遮蔽材料は異なります。"],["昔のガソリンには鉛が入っていた？","かつてはエンジンのノッキングを抑えるため有機鉛化合物を添加した有鉛ガソリンが広く使われました。健康・環境への影響から世界的に無鉛化が進みました。"],["鉛はなぜPb？","元素記号Pbはラテン語のplumbumに由来します。英語leadの頭文字とは一致しません。英語のplumbingという言葉も、歴史的に鉛管が使われたことと関係があります。"],["鉛蓄電池は古いからもう使われない？","鉛蓄電池は長い歴史を持ちますが、安価で大電流を供給しやすく、回収・リサイクルの仕組みも確立しているため、自動車などで現在も大切です。"]],'EL-083-BI':[["ビスマスは虹色になる？","ビスマス結晶の表面には薄い酸化膜ができ、その膜で光が干渉することで虹色に見えることがあります。金属そのものが何色もの顔料を含んでいるわけではありません。"],["重い金属なのに比較的低毒性？","ビスマスは重い元素ですが、鉛や水銀などと比べて一般に毒性が低いとされ、医薬品などにも化合物として利用されます。ただし化合物や摂取量による違いはあります。"],["ビスマスは固まると膨らむ？","ビスマスは液体から固体になる際に体積が増える珍しい性質を持ちます。水が凍ると膨張する現象と少し似ています。"],["ビスマスは永久磁石に反発する？","ビスマスは強い反磁性を示す代表的な元素です。強い磁場では磁石から押し出される方向の力を受け、磁気浮上の実験でもよく登場します。"]],'EL-084-PO':[["ポロニウムの名前はポーランド？","ポロニウムはマリー・キュリーが祖国ポーランドにちなんで名付けました。当時ポーランドは独立国家ではなく、その存在を世界へ訴える意味もあったとされます。"],["ポロニウムは非常に強い放射性元素？","代表的なポロニウム210は強いアルファ線を放出します。外部からのアルファ線は皮膚を通りにくい一方、体内に取り込まれると非常に危険なため厳格な管理が必要です。"],["熱源として使われたこともある？","ポロニウム210は放射性崩壊で大きな熱を出すため、歴史的には特殊な熱源として検討・利用された例があります。現在は一般的な材料ではありません。"]],'EL-085-AT':[["アスタチンは地球上で最も少ない元素の一つ？","アスタチンには安定同位体がなく、天然ではウランなどの放射壊変系列で一時的に生じます。地殻中に同時に存在する量は極めて少ないと考えられています。"],["名前は『不安定』が由来？","アスタチンの名称は、ギリシャ語で『不安定』を意味する言葉に由来します。すべての同位体が放射性である特徴をそのまま表した名前です。"],["がん治療で研究されている？","アスタチン211はアルファ線を利用する標的放射線治療の候補として研究が進められています。非常に希少で半減期も短いため、製造・輸送・利用には高度な技術が必要です。"]],'EL-086-RN':[["ラドンは気体なのに放射性？","ラドンは希ガスですが、すべての同位体が放射性です。化学反応しにくいことと、原子核が安定していることは別の性質です。"],["家の中にもラドンが入ることがある？","地盤や建材から生じたラドンが建物へ入り、換気条件によって室内濃度が高くなることがあります。世界的には重要な自然放射線被ばく源の一つです。"],["ラドンはにおいで気づける？","ラドンは無色・無臭の気体なので、人の感覚では濃度を判断できません。必要な場合は専用の測定器で確認します。"]],'EL-087-FR':[["フランシウムは自然界に存在する？","フランシウムは天然の放射壊変系列でごく微量生じるため、自然界にも存在します。ただし半減期が短く、まとまった量が蓄積することはありません。"],["名前はフランスから？","フランシウムは発見者マルグリット・ペレーの母国フランスにちなんで名付けられました。"],["フランシウムの塊を見ることはできる？","地球上に同時に存在する量が極めて少なく、半減期も短いため、目で見られるような大きな金属塊を作って観察する元素ではありません。物性値の多くも実験や理論から推定されます。"]],'EL-088-RA':[["ラジウムは昔『光る塗料』に使われた？","ラジウムを蛍光体と組み合わせた夜光塗料は、時計の文字盤などに使われた歴史があります。しかし作業者の深刻な放射線被ばくが社会問題となり、安全管理の重要性を示す事例になりました。"],["ラジウムを発見したのはキュリー夫妻？","マリー・キュリーとピエール・キュリーらは1898年、ウラン鉱石の研究からラジウムの存在を報告しました。放射能研究の歴史を代表する元素です。"],["ラジウムは暗闇で自分から緑色に光る？","ラジウムそのものが強く緑色に光るというイメージは正確ではありません。歴史的な夜光塗料では、ラジウムの放射線が硫化亜鉛などの蛍光体を発光させていました。"]],'EL-089-AC':[["アクチニウムはアクチノイドの名前の元？","アクチニウムはアクチノイド系列の名前の由来となった元素です。周期表では原子番号89から始まる重い放射性元素群の入口に位置します。"],["名前は『光線』が由来？","アクチニウムの名称はギリシャ語で『光線』を意味する言葉に由来します。放射性元素らしい名称です。"],["アクチニウム225はがん治療で注目？","アクチニウム225は強いアルファ線を利用する標的放射線治療の核種として研究・臨床利用が進んでいます。供給量が限られることも大きな課題です。"]],'EL-090-TH':[["トリウムの名前は北欧神話のトール？","トリウムは北欧神話の雷神Thorにちなんで名付けられました。元素名と神話が直接つながる例です。"],["トリウムも核燃料になり得る？","トリウム232自体は熱中性子で直接核分裂しやすい核種ではありませんが、中性子を吸収してウラン233へ変換できるため、トリウム燃料サイクルが研究されてきました。"],["昔のガスマントルにトリウム？","歴史的なガス灯のマントルには酸化トリウムが使われたものがありました。加熱すると明るく発光する性質を利用していましたが、現在は放射線安全の観点から代替材料が一般的です。"]],'EL-091-PA':[["名前は『アクチニウムの前』？","プロトアクチニウムは放射壊変によってアクチニウムへつながることから、『アクチニウムの前』を意味する名称が付けられました。"],["非常に希少な天然元素？","プロトアクチニウムはウラン鉱石中にごく微量存在しますが、濃度が低く放射性でもあるため、一般的な工業材料として扱う元素ではありません。"],["研究が難しいのはなぜ？","希少性に加えて放射性があり、取り扱える量や設備が限られます。そのため化学・物性データの蓄積も一般金属ほど容易ではありません。"]],'EL-092-U':[["天然ウランは全部同じウラン？","天然ウランには主にウラン238と少量のウラン235など複数の同位体が含まれます。原子番号は同じでも中性子数が違い、核的な性質も異なります。"],["ウランはものすごく重い？","金属ウランの密度は約19.1g/cm³で、金やタングステンに近い非常に高密度な金属です。放射性だけでなく、金属材料としても特徴的な物性を持ちます。"],["ウランガラスはなぜ光る？","少量のウラン化合物を含むガラスは、紫外線を当てると鮮やかな黄緑色の蛍光を示すことがあります。古い装飾ガラスなどで知られますが、取り扱いは適切な管理が前提です。"],["原子力発電ではどのウランが重要？","一般的な軽水炉では核分裂しやすいウラン235の割合を天然状態より高めた燃料が使われます。ウランという元素名だけでは、燃料としての性質を十分に説明できません。"]],'EL-093-NP':[["ネプツニウムは海王星から？","ウランが天王星Uranusに由来することになぞらえ、その次の元素ネプツニウムは海王星Neptuneにちなんで名付けられました。"],["最初の超ウラン元素？","ネプツニウムは原子番号93で、ウランより原子番号が大きい超ウラン元素として最初に人工生成・確認された元素です。"],["自然界には全く存在しない？","主に人工的に生成される元素ですが、ウラン鉱石中などで核反応により極微量生じることがあります。『人工元素＝自然界に絶対ない』とは限りません。"]],'EL-094-PU':[["プルトニウムの名前は冥王星？","ネプツニウムの次に発見されたことから、当時惑星とされていた冥王星Plutoにちなんでプルトニウムと名付けられました。"],["プルトニウム238は宇宙探査に使われる？","プルトニウム238の放射性崩壊で生じる熱を電気へ変える放射性同位体熱電気転換器は、太陽光が弱い深宇宙探査などで利用されています。"],["プルトニウムにはいろいろな同位体がある？","プルトニウム239や238など複数の同位体があり、半減期や核的性質が異なります。『プルトニウム』だけで用途や性質を一括りにはできません。"]],'EL-095-AM':[["アメリシウムの名前はアメリカ大陸？","アメリシウムはAmericaにちなんで名付けられました。周期表で上に位置するユウロピウムがEurope由来であることとの対応も意識されています。"],["煙感知器では何をしている？","イオン化式煙感知器では、微量のアメリシウム241から出る放射線で空気をイオン化し、煙が入ったときの電流変化を検出します。"],["アメリシウムは家庭で取り出していい？","いいえ、放射性物質を含む機器は分解せず、地域や製品の規則に従って扱う必要があります。用途が身近でも、材料そのものを直接扱うこととは別です。"]],'EL-096-CM':[["キュリウムはキュリー夫妻から？","キュリウムは放射能研究に大きく貢献したマリー・キュリーとピエール・キュリーに敬意を表して名付けられました。"],["キュリウムは自然に大量にある？","キュリウムは主に原子炉などで人工的に生成される超ウラン元素です。天然には実質的にまとまった量が存在しません。"],["キュリウムは自分の熱で温かくなる？","一部のキュリウム同位体は強い放射性崩壊熱を生じます。まとまった量では自己発熱が重要になるため、研究・保管では熱と放射線の両方を考える必要があります。"]],'EL-097-BK':[["バークリウムはバークレーから？","バークリウムは、元素が発見されたカリフォルニア大学バークレー校とその地名Berkeleyにちなんで名付けられました。"],["バークリウムは何に使う？","生産できる量が非常に少なく放射性でもあるため、一般製品の材料ではなく、より重い元素を合成するための標的など基礎研究が中心です。"],["新元素を作る材料にもなる？","バークリウム249は、さらに重い元素を合成する実験の標的として利用された例があります。元素そのものが『次の元素を作る材料』になります。"]],'EL-098-CF':[["カリホルニウムはカリフォルニアから？","カリホルニウムは発見地であるカリフォルニア州とカリフォルニア大学にちなんで名付けられました。"],["カリホルニウム252はなぜ中性子源になる？","カリホルニウム252は自発核分裂を起こしやすく、その際に複数の中性子を放出します。このため小型でも強い中性子源として利用できます。"],["普通の金属材料のように使える？","極めて希少で強い放射能を持つため、構造材や日用品のように使う元素ではありません。利用は専門施設での中性子源や研究などに限られます。"]],'EL-099-ES':[["アインスタイニウムはアインシュタインから？","その通りで、物理学者アルベルト・アインシュタインに敬意を表して名付けられました。"],["最初は核実験の生成物から見つかった？","アインスタイニウムは1952年の熱核実験の生成物を分析する中で発見されました。発見の経緯自体が核科学の歴史と深く結び付いています。"],["目で見える量を作れる？","ごく少量の生成・研究は可能ですが、強い放射性と短い半減期の同位体が中心で、一般的な金属試料のような大きな塊を扱う元素ではありません。"]],'EL-100-FM':[["フェルミウムはエンリコ・フェルミから？","フェルミウムは原子核物理学に大きく貢献したエンリコ・フェルミに敬意を表して名付けられました。"],["フェルミウムも核実験から発見された？","フェルミウムはアインスタイニウムと同様、1952年の熱核実験生成物の分析から発見されました。"],["フェルミウムに実用品はある？","生成できる量が極めて少なく、同位体も放射性であるため、現在の用途は基礎的な原子核・元素研究が中心です。"]],'EL-101-MD':[["メンデレビウムは周期表を作ったメンデレーエフから？","その通りです。元素の周期律を体系化したドミトリ・メンデレーエフに敬意を表して名付けられました。周期表そのものを象徴するような元素名です。"],["原子を一個ずつ扱うような研究？","メンデレビウムのような超ウラン元素は生成量が非常に少なく、化学的性質の研究ではごく少数の原子を素早く分離・検出する技術が重要になります。"],["実用品として使われている？","半減期や生成量の制約から一般製品の材料ではなく、原子核や重元素の性質を調べる基礎研究が中心です。"]],'EL-102-NO':[["ノーベリウムはノーベル賞のノーベル？","はい、ダイナマイトの発明やノーベル賞の創設で知られるアルフレッド・ノーベルにちなんで名付けられました。"],["発見をめぐって議論があった？","ノーベリウムは複数の研究グループから発見報告が出され、初期の同定には混乱もありました。超重元素では『作った』だけでなく、崩壊系列などから確実に同定することが大切です。"],["ノーベリウムは金属の塊にできる？","生成できる原子数が極めて少なく放射性でもあるため、一般的な金属材料のような塊を作って性質を測る元素ではありません。"]],'EL-103-LR':[["名前はサイクロトロンの発明者から？","ローレンシウムはサイクロトロンを発明した物理学者アーネスト・ローレンスにちなんで名付けられました。"],["アクチノイドの最後の元素？","ローレンシウムは原子番号103で、一般にアクチノイド系列の最後に置かれます。電子配置には興味深い特徴があり、周期表上の位置づけも研究対象になります。"],["性質はどうやって調べる？","短寿命で少数しか作れないため、生成直後の原子を高速に分離し、崩壊や化学反応を一原子レベルで追跡して性質を推定します。"]],'EL-104-RF':[["ラザホージウムはラザフォードから？","原子核の存在を示したことで知られるアーネスト・ラザフォードに敬意を表した名称です。"],["ハフニウムの下なら性質も似ている？","周期表では第4族でハフニウムの下に位置します。実験では第4族元素らしい化学挙動が調べられていますが、重い元素では相対論的効果も無視できません。"],["元素名をめぐる争いもあった？","超重元素の発見では米国と旧ソ連の研究グループなどの優先権・命名をめぐる長い議論がありました。ラザホージウムもその分かりやすい例です。"]],'EL-105-DB':[["ドブニウムは研究所の町の名前？","ロシアの合同原子核研究所がある都市ドゥブナにちなんで名付けられました。超重元素の歴史で非常に重要な研究拠点です。"],["タンタルの下なら同じような化学？","ドブニウムは第5族でタンタルの下にあります。少数原子を使った化学実験によって、ニオブやタンタルとの類似点・相違点が研究が進められています。"],["一個の原子で化学実験ができる？","超重元素では多数の試料を用意できません。そのため生成した原子を一つずつ分離し、吸着や溶液中の挙動などから化学的性質を調べる特殊な実験が行われます。"]],'EL-106-SG':[["存命中の人物名が元素についた最初の例？","シーボーギウムは、プルトニウムなど多くの超ウラン元素の発見に貢献したグレン・T・シーボーグにちなみます。存命中の人物に正式な元素名が付いたことで大きな話題になりました。"],["タングステンの仲間として振る舞う？","第6族に位置するため、クロム・モリブデン・タングステンとの化学的な類似性が研究が進められています。ごく少数の原子でも周期律がどこまで成り立つかを確かめられます。"],["なぜ超重元素を作るの？","直接的な実用品を作るためではなく、原子核がどこまで存在できるか、周期表の規則が極端に重い元素でも成り立つかを検証することが大きな目的です。"]],'EL-107-BH':[["ボーリウムはボーアから？","原子構造の理解に大きく貢献した物理学者ニールス・ボーアに敬意を表して名付けられました。"],["レニウムの下にある元素？","周期表では第7族でレニウムの下に位置します。化学実験では第7族元素としての性質がどの程度現れるかが研究が進められています。"],["作ってもすぐなくなる？","ボーリウムの同位体は放射性で、生成した原子は時間とともに別の原子核へ崩壊します。その崩壊エネルギーや時間が元素同定の手掛かりになります。"]],'EL-108-HS':[["ハッシウムの名前はドイツの州？","発見に関わった研究所があるドイツ・ヘッセン州のラテン語名Hassiaに由来します。"],["オスミウムと似た化合物を作る？","第8族でオスミウムの下に位置し、揮発性の四酸化物を形成することが実験的に確認されています。少数原子の化学から周期律を確かめた興味深い例です。"],["目で見ることはできる？","実験で作られる量は原子単位であり、肉眼で金属片を見るような元素ではありません。図鑑の代表画像は実物の塊ではなく研究イメージとして扱う必要があります。"]],'EL-109-MT':[["マイトネリウムは女性科学者の名前？","核分裂研究に大きく貢献した物理学者リーゼ・マイトナーに敬意を表して名付けられました。"],["実験で何原子くらい作れる？","超重元素は反応確率が非常に低く、実験条件によっては長時間照射して数原子しか検出できないこともあります。大量生産とは正反対の世界です。"],["性質がまだよく分からないのはなぜ？","寿命が短く生成量も極端に少ないため、化学的・物理的性質を直接測定することが難しく、多くが理論予測や周期表上の位置から研究が進められています。"]],'EL-110-DS':[["名前は発見地ダルムシュタット？","ドイツの重イオン研究所がある都市ダルムシュタットにちなんで名付けられました。"],["白金の仲間になる？","周期表では第10族で、ニッケル・パラジウム・白金の下に位置します。ただし実験できる原子数が少なく、詳細な化学性質には未解明な点があります。"],["どうやって作る？","加速器で重い原子核同士を高速で衝突させ、ごくまれに融合してできた原子核を検出します。成功確率が極めて低い実験です。"]],'EL-111-RG':[["名前はX線を発見したレントゲンから？","X線を発見したヴィルヘルム・レントゲンに敬意を表して名付けられました。"],["金の下にあるなら金色？","周期表では第11族で金の下にありますが、肉眼で確認できる量が作られていないため、実際の塊の色を観察したわけではありません。理論的な性質と実測を区別する必要があります。"],["超重元素にも周期律は通用する？","原子番号が大きくなると電子が非常に高速で運動し、相対論的効果が強くなります。レントゲニウムは金や銀との類似性だけでなく、そのずれを調べる対象でもあります。"]],'EL-112-CN':[["コペルニシウムはコペルニクスから？","地動説で知られるニコラウス・コペルニクスに敬意を表して名付けられました。"],["水銀の下なのに液体？","周期表では水銀の下に位置しますが、実際に液体のコペルニシウムを観察したわけではありません。極端に重い元素では相対論的効果が強く、物性予測も単純ではありません。"],["金属なのに揮発しやすい可能性？","コペルニシウムは第12族元素としては非常に揮発性が高い可能性が実験・理論から研究が進められています。『重い金属＝高沸点』という単純なイメージが通用しない面白さがあります。"]],'EL-113-NH':[["ニホニウムは日本で命名された初の元素？","ニホニウムは理化学研究所のチームによる発見が認定され、日本にちなんで命名されました。アジアの研究グループが命名権を得た初の元素でもあります。"],["名前の『ニホン』は本当に日本？","元素名Nihoniumと記号Nhは日本の呼称『日本（Nihon）』に由来します。周期表に日本の名前が刻まれています。"],["どうやって113番元素を確認した？","亜鉛原子核をビスマス標的へ衝突させて生成し、その後に続く連続したアルファ崩壊を追跡することで原子番号113の生成を確認しました。"],["ニホニウムの実用品はある？","現在は数原子規模の生成と基礎研究が中心で、製品材料として利用できる元素ではありません。価値は原子核物理と周期表の限界を知ることにあります。"]],'EL-114-FL':[["名前はフレロフ研究所から？","フレロビウムはロシアのフレロフ核反応研究所にちなみ、その研究所名は物理学者ゲオルギー・フリョロフに由来します。"],["鉛の下なのに鉛らしくない？","第14族で鉛の下に位置しますが、強い相対論的効果によって通常の第14族金属とは異なる性質を示す可能性が研究が進められています。"],["『安定の島』に近い元素？","超重元素には特定の陽子数・中性子数で寿命が比較的長くなる『安定の島』が予測されています。フレロビウム周辺の原子核研究は、その考えを検証する手掛かりになります。"]],'EL-115-MC':[["モスコビウムはモスクワから？","名称は研究に関係するドゥブナを含むモスクワ州にちなんで付けられました。"],["作るための材料も超特殊？","モスコビウムの合成では、アメリシウムなどの放射性標的へカルシウム48の原子核を衝突させる実験が行われました。標的材料そのものの準備も高度な技術です。"],["なぜカルシウム48がよく使われた？","カルシウム48は陽子20・中性子28の二重魔法数核で比較的安定し、中性子が多いため、中性子過剰な超重原子核を作る反応に有利でした。"]],'EL-116-LV':[["名前はリバモア研究所から？","米国ローレンス・リバモア国立研究所と、その所在地リバモアにちなんで名付けられました。"],["酸素や硫黄の仲間？","周期表では第16族で酸素・硫黄・セレン・テルル・ポロニウムの下に位置します。しかし超重元素では相対論的効果が大きく、単純に同じ性質とは限りません。"],["原子核の寿命を測るだけでも研究になる？","超重元素では半減期や崩壊経路そのものが原子核構造を知る重要なデータです。数十ミリ秒や数秒という寿命でも、理論を検証する貴重な情報になります。"]],'EL-117-TS':[["テネシンは米国テネシー州から？","オークリッジ国立研究所など研究に貢献した機関があるテネシー州にちなんで名付けられました。"],["ハロゲンの仲間なの？","周期表では第17族でフッ素・塩素・臭素・ヨウ素・アスタチンの下に位置します。ただし非常に重いため相対論的効果が強く、典型的なハロゲンとは異なる性質も予測されています。"],["元素記号Tsは温度の記号ではない？","テネシンの正式な元素記号はTsです。材料分野では別の略号と重なる場合もあるため、文脈を見て元素記号かどうか判断します。"]],'EL-118-OG':[["オガネソンは周期表のいちばん最後？","現在正式に認定されている元素では、原子番号118のオガネソンが最も大きな原子番号を持ちます。将来119番以降が発見されれば周期表はさらに伸びます。"],["希ガスなのに普通の気体とは限らない？","第18族なので希ガスに分類されますが、非常に強い相対論的効果のため、アルゴンやキセノンのような典型的な希ガスとは異なる性質が理論的に予測されています。"],["存命の科学者にちなんだ元素？","オガネソンは超重元素研究を率いた核物理学者ユーリ・オガネシアンに敬意を表して命名されました。存命人物に由来する正式元素名の数少ない例です。"],["119番元素はもう見つかっている？","現在の正式な周期表は118番までです。119番以降の超重元素探索は続いており、周期表の次の行を埋める挑戦が進められています。"]],'ITO':[["透明なのに、なぜ電気を通せる？","ITOは酸化物なのに適切な組成や欠陥によって自由に動ける電子を持ち、薄膜では可視光を通しながら電気を流せます。透明性と導電性を両立することが最大の特徴です。"],["ITOは金属なの？","ITOはインジウムとスズの金属混合物ではなく、主に酸化インジウムへ酸化スズを加えた酸化物系のセラミックス材料です。ターゲットも焼結体として作られることがあります。"],["スマホを触った場所が分かるのにもITO？","静電容量式タッチパネルでは透明電極の電気的変化から指の位置を検出します。ITOは画面を隠さず電極を配置できるため、この仕組みを支えてきました。"],["ITOにも弱点がある？","透明導電性に優れる一方、インジウムは希少で、ITO薄膜は曲げに対して割れやすい場合があります。そのため銀ナノワイヤ、導電性高分子、他の酸化物など代替材料も研究が進められています。"],["スパッタリングとも深い関係？","大型ディスプレイなどのITO薄膜は、ITOターゲットを用いたスパッタリングで形成されることがあります。MonoBaseの材料・真空・スパッタリング学習が直接つながる代表材料です。"]],'IGZO':[["IGZOは何の頭文字？","Indium Gallium Zinc Oxideの頭文字で、インジウム・ガリウム・亜鉛・酸素からなる酸化物半導体材料です。単一の元素名ではありません。"],["なぜディスプレイを省電力にできる？","IGZO薄膜トランジスタはアモルファスシリコンより高い電子移動度を得やすく、画素を効率よく制御できます。回路設計と組み合わせることで高精細化や低消費電力化に役立ちます。"],["透明な半導体ってどういうこと？","IGZOは可視光を比較的通す酸化物でありながら、電気的には半導体として働かせられます。『透明＝絶縁体』とは限らないことが分かる材料です。"],["IGZOもスパッタリングで作れる？","ディスプレイ用のIGZO薄膜は、酸化物ターゲットを使ったスパッタリングなどで形成されます。酸素量や成膜条件が薄膜の電気特性に大きく影響します。"],["IGZOは結晶じゃないと使えない？","代表的なIGZO薄膜トランジスタでは、原子が長距離で規則正しく並ばないアモルファス状態でも比較的高い電子移動度を得られることが大きな利点です。大面積基板への形成にも適しています。"]],'CEO2':[["なぜガラス研磨に酸化セリウム？","酸化セリウム研磨では粒子で機械的に削る作用だけでなく、ガラス表面との化学的な相互作用も関係します。光学ガラスを高精度に仕上げる代表材料です。"],["酸素を『出し入れ』できる？","セリウムはCe³⁺とCe⁴⁺の状態を取りやすく、酸化セリウムは周囲の条件に応じて酸素を蓄えたり放出したりできます。この性質が自動車触媒などで役立ちます。"],["酸化セリウムはレアアース材料？","はい、セリウムは希土類元素の一つです。ただしセリウム自体は希土類の中では比較的存在量が多く、『レア』という言葉だけで極端に希少とは判断できません。"]],'MGO':[["酸化マグネシウムはなぜ炉に使える？","融点が非常に高く、塩基性の耐火物として高温に耐えられるため、製鉄などの炉材に大切です。"],["金属マグネシウムとは全然違う？","金属マグネシウムは軽く燃えやすい金属ですが、酸化マグネシウムは白色の安定したセラミックスです。同じ元素を含んでも酸化物になると性質は大きく変わります。"],["ヒーターの中にも入っている？","シーズヒーターでは発熱線と金属外装の間に酸化マグネシウム粉末を充填し、電気絶縁と熱伝達を両立させる構造が広く使われます。"]],'ALN':[["電気を通さないのに熱はよく通す？","窒化アルミニウムは電気絶縁性を持ちながら、セラミックスとしては非常に高い熱伝導性を示します。この組み合わせが電子部品の放熱基板に向いています。"],["アルミニウム金属とは何が違う？","AlNはアルミニウムと窒素からなる化合物セラミックスで、金属アルミのような延性はありません。硬く脆い一方、高温・絶縁用途で強みがあります。"],["パワー半導体の性能はチップだけで決まらない？","高性能な半導体でも熱を逃がせなければ性能や寿命が制限されます。AlN基板は『半導体を支える材料』として熱設計に大切です。"]],'SCALN':[["AlNにスカンジウムを入れると何が変わる？","AlNの一部のアルミニウムをスカンジウムで置き換えると、圧電応答を大きく高められます。少量の組成変更で機能が大きく変わる薄膜材料の分かりやすい例です。"],["圧電材料って何？","圧電材料は力を加えると電気的な応答を生じ、逆に電圧を加えるとわずかに変形します。この性質をフィルター、センサー、MEMSなどで利用します。"],["スマホの通信と関係する？","高周波通信では必要な周波数だけを選ぶフィルターが大切です。ScAlNは高性能な圧電薄膜として次世代高周波デバイスへの応用が研究・実用化されています。"],["スパッタリング条件も重要？","ScAlN薄膜は組成だけでなく結晶配向、応力、欠陥などで性能が変わります。スパッタリングのガス・圧力・電力・基板条件を制御することが大切です。"]],'GAN':[["青色LEDを可能にした材料？","高品質GaN系結晶とp型化などの技術進展によって高輝度青色LEDが実現し、白色LEDやフルカラー表示の発展につながりました。"],["GaN充電器はなぜ小さくできる？","GaNパワーデバイスは高い耐圧や高速スイッチング特性を活かし、電力変換回路を高周波化しやすくします。周辺部品を小さくでき、充電器の小型・高効率化につながります。"],["GaNはシリコンを全部置き換える？","GaNには優れた領域がありますが、シリコンは低コストで巨大な製造基盤を持ちます。電圧・電力・価格などに応じて材料を使い分けるのが現実です。"],["LEDとパワー半導体が同じ材料？","どちらもGaN系材料ですが、デバイス構造や結晶層、目的は異なります。一つの材料系が『光を出す』用途と『電力を制御する』用途の両方で活躍しています。"]],'TIN':[["金色だけど金は入っていない？","TiNは金色に見える代表的なセラミックコーティングですが、金を含んでいるわけではありません。電子構造による光の反射特性が金色の外観を生みます。"],["工具に薄く付けるだけで何が変わる？","TiNの硬い薄膜を工具表面に形成すると摩耗や凝着を抑え、工具寿命を延ばせます。部品全体を高価な材料にするのではなく、表面だけを機能化する考え方です。"],["TiNもスパッタリングで作れる？","はい、Tiターゲットと窒素を使う反応性スパッタリングなどでTiN薄膜を形成できます。窒素量などによって組成・色・硬さ・電気特性が変わります。"]],'TAN':[["抵抗器に窒化タンタル？","TaN薄膜は電気抵抗が比較的安定で、精密薄膜抵抗や電子回路材料として利用されます。"],["半導体では『壁』にもなる？","タンタル系窒化物は金属原子などが隣の層へ拡散するのを抑えるバリア材料として半導体配線技術で大切です。"],["窒素量で性質が変わる？","Ta-N系には組成や結晶構造の異なる相があり、電気抵抗や硬さなども変化します。『窒化タンタル』という名前だけでは一つの物性に決まりません。"]],'WN':[["タングステン金属より何が違う？","窒化すると硬さや化学的性質、電気特性が変わります。薄膜では耐摩耗性や拡散防止など、金属Wとは異なる機能を狙えます。"],["半導体の薄いバリア層にも？","WN系薄膜は配線材料の拡散を抑えるバリア層や電極材料として研究・利用されます。数nm〜数十nm級の薄膜でも重要な役割を持ちます。"],["薄膜の組成管理が大切？","反応性スパッタリングなどでは窒素流量や電力条件によってW-N膜の組成や相が変化し、抵抗率や硬さも変わります。"]],'CRN':[["CrNはクロムめっきと同じ？","いいえ、クロムめっきは金属Crを表面に形成するのに対し、CrNはクロムと窒素のセラミック化合物です。外観や硬さ、摩擦特性も異なります。"],["TiNとの違いは？","どちらも硬質コーティングですが、CrNは耐食性や耐酸化性、特定条件での摩擦特性などを理由に選ばれることがあります。用途によって最適膜は変わります。"],["金型にも使われる？","CrNコーティングは金型や摺動部品などで摩耗・凝着・腐食を抑える目的に利用されます。"]],'ZRN':[["ZrNも金色に見える？","ZrNは組成や膜状態によって淡い金色系の外観を示し、装飾コーティングにも利用されます。金色でも金とは限らない例がここにもあります。"],["見た目だけの膜ではない？","装飾性だけでなく、高硬度や耐摩耗性、耐食性などを持つため、表面保護と外観を同時に狙える材料です。"],["薄膜の色は成膜条件でも変わる？","窒素量や膜厚、組成、表面状態などで光学特性が変わるため、同じZrNでも見え方が一定とは限りません。"]],'HFN':[["HfNはものすごく熱に強い？","HfNは非常に高い融点を持つ耐火性窒化物で、超高温材料の候補として研究が進められています。"],["ハフニウム金属と同じ用途？","金属Hfは原子炉制御材などで知られますが、HfNでは硬さ・耐熱性・電気特性など化合物ならではの性質を利用します。"],["超高温セラミックスはどこで必要？","高速飛行体や宇宙機の先端部などでは極端な高温環境が想定されます。Hf系の炭化物・窒化物はそうした条件を目指す研究対象です。"]],'SI3N4':[["セラミックなのにベアリングに使える？","Si3N4は硬いだけでなく、鋼より軽く、耐摩耗性や耐熱性にも優れます。高速回転用のセラミックボールベアリングなどに利用されます。"],["セラミックスは全部『割れやすいだけ』？","Si3N4も金属のような延性はありませんが、微構造制御によって高い破壊靭性を持たせられます。セラミックスの性能は組成だけでなく組織設計にも左右されます。"],["半導体にも窒化ケイ素？","薄膜SiNxは半導体や太陽電池で絶縁膜、保護膜、反射防止膜などとして広く使われます。焼結部品のSi3N4とは形態や組成が少し異なる場合があります。"]],'HBN':[["『白い黒鉛』と呼ばれるのはなぜ？","h-BNは黒鉛と似た層状結晶構造を持ち、層同士が滑りやすい性質があります。色が白いため『白い黒鉛』と呼ばれることがあります。"],["電気を通さない黒鉛みたいな材料？","黒鉛は電気を通しますが、h-BNは優れた電気絶縁体です。似た層状構造でも構成元素が変わると電子的性質は大きく変わります。"],["化粧品にもセラミックス？","h-BN粉末は滑らかな感触、付着性、光の散乱などを利用して化粧品へ配合されることがあります。工業材料と日用品がつながる面白い例です。"],["二次元材料としても注目？","単層〜数層のh-BNは、グラフェンなど他の二次元材料を支える絶縁層として研究が進められています。原子レベルで平坦な基板として大切です。"]],'SIC':[["SiCはなぜEVで注目される？","SiCはシリコンより広いバンドギャップと高い絶縁破壊電界を持ち、高電圧・高温で損失の少ないパワーデバイスを作りやすいためです。"],["ダイヤモンドに近いほど硬い？","SiCは非常に硬く、古くから研磨材として利用されてきました。ただし結晶構造や用途はダイヤモンドとは別物です。"],["同じSiCなのに種類がたくさん？","SiCには原子の積層順序が異なる多数のポリタイプがあります。パワー半導体では4H-SiCが代表的で、結晶構造の違いが電気特性にも影響します。"],["半導体と研磨材が同じ化学式？","どちらもSiCですが、半導体では極めて高純度な単結晶と精密な結晶制御が必要です。化学式が同じでも純度・結晶性・欠陥で価値が大きく変わります。"]],'WC':[["超硬合金はWCだけでできている？","代表的な超硬合金は硬いWC粒子をコバルトなどの金属結合相で固めた複合材料です。硬さと靭性のバランスを組織設計で調整します。"],["ダイヤモンドより硬い？","WCは非常に硬い材料ですが、一般にダイヤモンドの方が硬度は高いです。工具では硬さだけでなく靭性、耐熱性、相手材との反応なども大切です。"],["なぜドリルの先に使う？","刃先は高い圧力と摩擦、熱にさらされます。WC系超硬合金は高硬度と耐摩耗性を保ちやすく、金属加工や岩石掘削で活躍します。"]],'TIC':[["TiCは金属？セラミックス？","TiCはセラミックスに分類される硬質化合物ですが、金属的な電気伝導性も持ちます。金属とセラミックスの性質を単純に二分できない材料です。"],["サーメットって何？","ceramicとmetalを組み合わせた言葉で、TiCやTi(C,N)などの硬質粒子と金属結合相を組み合わせた切削工具材料などを指します。"],["TiNとTiCはどう使い分ける？","どちらも硬質材料ですが、硬さ、摩擦、耐酸化性、相手材との反応などが異なります。工具では単層だけでなく多層膜として組み合わせることもあります。"]],'TAC':[["TaCは融点がものすごく高い？","TaC系材料は既知の材料の中でも極めて高い融点を持つことで知られ、超高温セラミックスの研究対象です。"],["硬いだけでは超高温材料になれない？","高温用途では融点だけでなく酸化、熱衝撃、熱伝導、機械強度なども大切です。TaCの高融点だけで実用性能が決まるわけではありません。"],["超硬合金にも少量入る？","TaCはWC系超硬合金へ添加され、粒成長抑制や高温特性などを調整する目的で使われることがあります。"]],'NBC':[["NbCも超硬合金を助ける？","NbCは硬質炭化物として、超硬合金や耐摩耗材料へ添加されることがあります。微量の添加でも組織や高温特性へ影響します。"],["鋼の中にも小さなNbCができる？","ニオブを含む鋼では微細なニオブ炭化物・炭窒化物が析出し、結晶粒の成長を抑えたり強度を高めたりします。"],["大きな塊と微細析出物で役割が違う？","同じNbCでも、焼結した硬質材料として使う場合と、鋼中にナノ〜微細サイズで析出させる場合では役割が大きく異なります。"]],'B4C':[["ダイヤモンド級に硬い？","B4Cは非常に高い硬度を持ち、ダイヤモンドや立方晶窒化ホウ素に次ぐ硬質材料として知られます。"],["硬いのに軽い？","B4Cは高硬度でありながら密度が比較的低いため、重量を抑えたい防護セラミックスなどに適しています。"],["原子炉でなぜ使われる？","天然ホウ素に含まれるホウ素10は中性子を強く吸収します。B4Cは高温にも耐えやすく、制御棒や中性子吸収材に利用されます。"],["防弾材は硬ければいい？","弾丸を破砕する硬さだけでなく、衝撃をどう受け止めるか、裏側の材料とどう組み合わせるかも大切です。B4Cは複合防護システムの一部として使われます。"]],'MO2C':[["炭化モリブデンは白金の代わりになる？","Mo2Cなどは一部の反応で白金族に似た触媒活性を示すことがあり、より豊富な元素を使う触媒候補として研究が進められています。ただし万能な代替ではありません。"],["触媒なのに硬いセラミックス？","炭化モリブデンは硬質・耐熱材料としての顔と、表面で化学反応を促進する触媒としての顔を持ちます。材料の使い道は、硬さや強さだけでは決まりません。"],["水素エネルギーとも関係する？","水素生成や水素化・脱水素などの反応に対する触媒として研究が進められています。表面組成や粒径、担体との組み合わせで性能が大きく変わります。"]],'COFEB':[["CoFeBはなぜMRAMで重要？","CoFeBは磁気特性を制御しやすく、MgOなどと組み合わせた磁気トンネル接合で高い磁気抵抗比を得られるため、STT-MRAMなどの重要材料です。"],["ホウ素は何をしている？","CoFeへBを加えることで成膜直後にアモルファス状態を作りやすくなり、その後の熱処理で界面付近の結晶性を整えるなど、薄膜構造の制御に役立ちます。"],["磁石なのに情報を記録できる？","磁化の向きを0と1に対応させれば、電源を切っても状態を保持できます。磁性材料の性質をデジタル情報へ利用するのが磁気メモリです。"],["数nmの膜でも材料設計が重要？","CoFeB/MgO系では膜厚、組成、界面、熱処理条件が磁気特性を大きく左右します。バルクの組成だけでは性能を語れない薄膜材料の分かりやすい例です。"]],'NIFE':[["パーマロイは永久磁石？","パーマロイ系Ni-Fe合金は永久磁石のように磁力を強く残すことより、弱い磁場で容易に磁化方向が変わる『軟磁性』を活かす材料です。"],["なぜ磁気シールドになる？","高い透磁率を持つ材料で周囲を囲むと、磁束を材料側へ導いて内部の磁場を弱められます。精密センサーなどを外部磁場から守る用途があります。"],["組成で磁気特性が大きく変わる？","NiとFeの比率や熱処理、加工履歴によって透磁率や保磁力が変わります。合金名が同じでも製造条件が大切です。"]],'COFE':[["Co-Fe合金はなぜ強い磁気を作れる？","Co-Fe系合金は非常に高い飽和磁束密度を得られる組成域があり、小型でも大きな磁束を扱いたいモーターや電磁機器で価値があります。"],["磁気材料は『磁力が強いほど良い』？","損失、保磁力、加工性、温度特性、価格なども大切です。Co-Feは高磁束密度が魅力ですが、用途に応じて電磁鋼板やNi-Fe系などと使い分けます。"],["航空機にも使われる？","重量や体積を抑えながら高い磁気性能が必要な発電機・アクチュエータなどで、Co-Fe系軟磁性合金が選ばれることがあります。"]],'ALSI':[["アルミにシリコンを入れるとなぜ鋳造しやすい？","Al-Si系は融液の流動性が良く、凝固時の収縮や割れを抑えやすい組成域があるため、複雑形状の鋳物に適しています。"],["シリコンは半導体なのに合金にも入る？","単体Siは半導体として有名ですが、Alへ添加すると鋳造性や耐摩耗性などを調整する合金元素として働きます。同じ元素でも役割は材料系で変わります。"],["自動車の軽量化にも関係する？","Al-Si鋳造合金は軽量で複雑な部品を作りやすく、自動車のケースや構造・機械部品などに広く利用されています。"]],'ALSICU':[["Al-Siに銅を加えると何が変わる？","Cu添加は強度や熱処理による硬化などに寄与します。一方、耐食性などとのバランスも変わるため、用途に応じた組成設計が必要です。"],["鋳造合金は成分だけで性能が決まる？","凝固速度、熱処理、Si粒子や金属間化合物の形態、欠陥量などで機械特性が大きく変わります。製造条件も材料設計の一部です。"],["軽いだけでは自動車材料になれない？","自動車部品には強度、耐熱性、鋳造性、加工性、コストなどが同時に求められます。Al-Si-Cu系はそのバランスを取る代表的な鋳造合金です。"]],'TIW':[["TiWはなぜ半導体で使う？","TiW薄膜は下地との密着性や拡散を抑える性質を利用し、多層配線のバリア・密着層などに使われます。"],["厚い構造材より薄膜で活躍する合金？","TiWは一般的な機械構造材というより、電子デバイスの薄膜材料として目にすることが多い合金です。数十nm程度の層でも重要な役割を持ちます。"],["TiとWを混ぜる意味は？","Tiの反応性・密着性とWの耐熱性など、単一元素とは異なる特性バランスを狙えます。実際の性能は組成や成膜条件でも変わります。"]],'MOW':[["MoとWはなぜ混ぜやすい？","MoとWは周期表で同じ第6族にあり、原子サイズや結晶構造も近いため広い組成範囲で固溶体を作ります。"],["タングステンだけではだめ？","Wは非常に高融点ですが、Moとの合金化で加工性や物性、使用温度域などのバランスを調整できます。材料選びでは、一つの物性値だけでなく全体のバランスを見る必要があります。"],["高温材料なのに酸化には注意？","MoやWは高温強度に優れる一方、酸化雰囲気では酸化が問題になります。真空・不活性雰囲気や表面保護など、使用環境の設計が大切です。"]],'MOSI2':[["MoSi2ヒーターはなぜ高温で使える？","MoSi2は高温の酸化雰囲気で表面に保護性の高いSiO2層を形成し、内部の酸化を抑えます。この自己保護性が高温発熱体として大切です。"],["金属？セラミックス？","MoSi2は金属間化合物・シリサイドとして、電気を通す性質とセラミックス的な耐熱性を併せ持ちます。単純な金属・セラミックス二分類では説明しにくい材料です。"],["電気を流すと自分で熱くなる？","電気抵抗によるジュール熱を利用して発熱体になります。工業炉では棒状やU字形などのMoSi2ヒーターが高温加熱に使われます。"],["高温に強くても室温では万能ではない？","MoSi2は高温酸化に強い一方、低温域での脆さなど課題もあります。どの温度域で力を発揮する材料なのかを見極める必要があります。"]],'WSI2':[["WSi2はなぜ半導体に登場する？","WSi2は導電性と耐熱性を持つ高融点シリサイドで、半導体のゲート・配線関連材料として利用されてきました。"],["シリコンと金属の中間のような材料？","金属元素WとSiからなる化合物で、金属的な導電性と高温安定性を持ちます。シリサイドは半導体プロセスで重要な材料群です。"],["薄膜では抵抗値も重要？","配線・電極材料では薄膜抵抗、界面反応、熱安定性などが性能を左右します。化学式が同じでも、膜厚や成膜条件、熱処理で特性は変わります。"]],'TASI2':[["TaSi2もシリサイドの仲間？","はい、TaとSiからなる高融点シリサイドで、導電性・耐熱性を利用する薄膜や高温材料の研究対象です。"],["高温で酸化するとどうなる？","シリサイドでは条件によってSiO2を含む酸化層が形成され、酸化挙動に影響します。ただし温度や組成によって保護性は変わります。"],["シリサイドは全部同じ性能？","MoSi2、WSi2、TaSi2などは同じシリサイドでも結晶構造、抵抗率、酸化特性などが異なります。用途に合わせて選択します。"]],'MGF2':[["レンズに薄く付けると反射が減る？","MgF2は屈折率が低く、適切な膜厚でレンズ表面に形成すると光の干渉によって反射を減らせます。古典的で重要な単層反射防止膜です。"],["透明なら何でも反射防止膜になる？","反射防止には基板との屈折率関係や膜厚、対象波長が大切です。透明であるだけでは十分ではありません。"],["MgF2は真空成膜とも関係する？","光学部品のMgF2薄膜は真空蒸着などで形成されます。膜厚を光の波長レベルで制御することが光学性能につながります。"]],'CAF2':[["蛍石とCaF2は同じ？","天然鉱物の蛍石の主成分がCaF2です。美しい結晶として知られる一方、高純度人工結晶は高性能光学材料として利用されます。"],["普通のガラスが通しにくい光も通す？","CaF2は紫外から赤外まで広い波長域で高い透過性を持ち、特殊なレンズや窓材に利用されます。"],["半導体露光装置にも使われた？","深紫外光を使う光学系では、通常の光学ガラスでは吸収が問題になるため、高純度CaF2結晶がレンズ材料として重要になりました。"],["『蛍光』という言葉とも関係する？","fluorescenceという言葉は蛍石fluoriteの発光現象研究に由来します。CaF2は光学だけでなく言葉の歴史にも残っています。"]],'LIF':[["LiFは食塩みたいな結晶構造？","LiFは代表的なイオン結晶で、常温ではNaCl型の結晶構造を取ります。ただし性質や用途は食塩とは大きく異なります。"],["紫外線をかなり短い波長まで通す？","LiFは真空紫外域まで透過できる代表的な結晶材料の一つで、特殊な分光・光学用途で価値があります。"],["放射線を測る材料にも？","LiFは熱蛍光線量計の材料として利用されてきました。放射線で蓄えられたエネルギーを加熱時の発光として読み取ります。"]],'ALF3':[["アルミ製錬でフッ化物が必要なのはなぜ？","アルミナをそのまま溶かすには非常に高温が必要です。氷晶石系の溶融塩とAlF3などを用いて浴の性質を調整し、工業的な電解製錬を可能にします。"],["金属アルミとは全く違う材料？","AlF3はアルミニウムとフッ素からなる化合物で、軽く延びる金属Alとは性質が大きく異なります。元素と化合物を区別する分かりやすい例です。"],["光学薄膜にも使える？","フッ化物は紫外域で透明性を持つものがあり、AlF3も紫外光学向けの薄膜材料として利用・研究されます。"]],'LICOO2':[["スマホ電池の正極にLCO？","LiCoO2は高い体積エネルギー密度を得やすく、小型電子機器のリチウムイオン電池で長く使われてきた代表的正極材料です。"],["充電するとリチウムはどこへ行く？","充電時には正極LiCoO2からリチウムイオンの一部が抜け、電解質を通って負極側へ移動します。放電では逆方向へ戻ります。"],["電池の中に金属リチウムが詰まっている？","一般的なLiCoO2系リチウムイオン電池では、リチウムは主に化合物中のイオンとして存在します。『リチウム電池＝金属Liの塊』ではありません。"],["コバルトを減らす研究が進むのはなぜ？","コスト、資源供給、採掘に関する社会・環境面などから、コバルト使用量を抑えた正極やLFPなど別系統の材料開発が進んでいます。"]],'LIMN2O4':[["LMOの結晶は『スピネル型』？","代表的なLiMn2O4は三次元的にリチウムイオンが移動できるスピネル型結晶構造を持ち、比較的高い出力特性につながります。"],["マンガンを使うメリットは？","マンガンはコバルトなどに比べ資源的に豊富でコスト面の利点があります。電池材料では性能だけでなく資源性も大切です。"],["LMOだけで電池を作るとは限らない？","実用電池ではLMOを他の正極材料と混合して、出力・寿命・容量などのバランスを取る設計もあります。"],["高温では劣化に注意？","LMOでは高温条件などでマンガンの溶出が寿命低下につながることがあります。材料改良や電解液・セル設計で対策が行われます。"]],'LIFEPO4':[["LFPはなぜ安全性で注目される？","LiFePO4はオリビン型構造の強いP-O結合を持ち、加熱時に酸素を放出しにくいことが高い熱安定性につながります。"],["LFPはコバルトもニッケルも使わない？","主成分はリチウム・鉄・リン・酸素で、正極活物質としてCoやNiを必要としません。資源・コスト面で大きな特徴の一つです。"],["エネルギー密度が低いのにEVで増えている？","一部の高Ni系正極より重量当たりのエネルギー密度では不利でも、寿命、安全性、コスト、資源性などを総合すると適する車種や蓄電用途があります。"],["LFPは電気を通しにくい？","LiFePO4自体の電子伝導性は高くないため、微粒子化やカーボンコーティングなどで導電性を補う材料設計が使われます。"],["電池材料も『組成だけ』では決まらない？","同じLFPでも粒径、炭素被覆、電極密度、電解液、セル設計などで性能が変わります。MonoBaseで材料名を知った先に製造技術があることが分かる分かりやすい例です。"]],'EL-001-H':[["水素は宇宙でいちばん多い元素？","宇宙では水素が最も多い元素で、恒星の主な燃料でもあります。一方、地球上では反応性があるため、水や有機物など化合物として存在する量が圧倒的に多い元素です。"],["水素が燃えるのに、水はなぜ燃えない？","水素は酸素と反応して水になるときにエネルギーを放出します。水はすでに反応後の安定な状態なので、水素ガスと同じようには燃えません。"],["『グリーン水素』は緑色なの？","グリーン、ブルー、グレーなどの呼び方は水素そのものの色ではなく、主に製造方法やCO2排出の考え方を区別する呼称です。水素ガス自体は無色です。"]],'EL-003-LI':[["リチウムは金属なのに水に浮く？","リチウムは非常に軽い金属で、密度は水より小さいため浮きます。ただし水とは反応するため、実際に試すような材料ではありません。"],["リチウムイオン電池には金属リチウムが入っている？","一般的なリチウムイオン電池では、リチウムは主に正極・負極材料の中をイオンとして移動します。金属リチウムをそのまま負極に使う電池とは区別されます。"],["軽いことは電池にも有利？","リチウムは非常に軽く、電気化学的にも高い電圧を得やすいため、高い重量エネルギー密度を狙う電池材料に適しています。"]],'EL-004-BE':[["ベリリウムは軽いのに硬い？","ベリリウムは低密度で剛性が高く、軽量で寸法安定性が必要な特殊用途に使われます。一方、粉じんなどには重大な健康リスクがあり厳格な管理が必要です。"],["エメラルドにもベリリウム？","宝石のエメラルドはベリリウムを含む鉱物ベリルの一種です。工業用金属と宝石が同じ元素でつながっています。"],["X線を通しやすい金属？","原子番号が小さいベリリウムはX線を比較的通しやすく、適切に管理されたX線装置の窓材など特殊用途に使われます。"]],'EL-005-B':[["耐熱ガラスにもホウ素？","ホウケイ酸ガラスはSiO2系ガラスへホウ素成分を加え、熱膨張を小さくして急な温度変化に強くした代表的なガラスです。"],["ホウ素は半導体にも少量入る？","シリコンへごく少量のホウ素を添加するとp型半導体を作れます。わずかな不純物が電気特性を大きく変える分かりやすい例です。"],["ホウ素は中性子を吸収する？","ホウ素10は中性子をよく吸収するため、B4Cなどの化合物として原子力・放射線計測分野に利用されます。"]],'EL-009-F':[["歯みがき粉のフッ素はF2ガス？","いいえ、歯みがき粉などで利用されるのは管理されたフッ化物です。単体のフッ素F2は非常に反応性が高く有毒で、性質はまったく異なります。"],["フッ素は最も反応性が高い元素？","フッ素は電気陰性度が最も高く、単体F2は非常に強い酸化性を持ちます。そのため自然界では主にフッ化物として存在します。"],["フッ素化合物は半導体製造にも？","フッ素を含むガスやプラズマは、シリコン系材料などを加工するドライエッチング工程で大切です。元素の強い反応性を制御して利用しています。"]],'EL-021-SC':[["スカンジウムをアルミへ少し入れると？","Al-Sc系では微細な析出物を形成させることで強度や耐熱性などを改善できます。少量添加で効く高価な合金元素の一つです。"],["ScAlNでもスカンジウムが活躍？","AlNへScを添加すると圧電応答を大きく高められ、高周波フィルターやMEMS向け薄膜材料として注目を集めています。"],["名前はスカンジナビアから？","スカンジウムの名称はScandinaviaに由来します。発見された鉱物の地域と元素名が結び付いています。"]],'EL-023-V':[["バナジウムは鋼を強くする？","バナジウムは鋼中で微細な炭化物・窒化物などを形成し、少量添加でも強度や耐摩耗性を高める目的で使われます。"],["バナジウムにはいろいろな色がある？","バナジウムイオンは酸化状態によって異なる色を示します。酸化数が変わると電子状態が変化することを視覚的に感じられる元素です。"],["大型蓄電池にもバナジウム？","バナジウムレドックスフロー電池では異なる酸化状態のバナジウムイオンを利用して電気を蓄えます。定置型の大規模蓄電用途で利用・研究が進められています。"]],'EL-031-GA':[["ガリウムは手の上で溶ける？","ガリウムの融点は約29.8℃なので、室温条件によっては固体でも手の温度付近で溶けます。ただし実験用材料を素手で扱うことを勧める意味ではありません。"],["青色LEDにもガリウム？","GaNやInGaNなどガリウムを含む化合物半導体は、青色LEDや高周波・パワーデバイスを支える重要材料です。"],["アルミを脆くすることがある？","液体ガリウムがアルミニウムへ侵入すると機械的性質を大きく損なう場合があります。材料同士の組み合わせで予想外の問題が起こる例です。"]],'EL-033-AS':[["ヒ素は半導体にも使われる？","GaAsなどの化合物半導体ではヒ素が重要な構成元素です。毒性を持つ元素でも、厳格な管理下では高速電子デバイスや光デバイスを支える材料になります。"],["ヒ素なら全部同じ毒性？","元素状ヒ素、無機ヒ素化合物、有機ヒ素化合物などで毒性や挙動は異なります。『ヒ素を含む』だけで同一の性質と考えるのは正確ではありません。"],["名前の由来は顔料にも関係する？","ヒ素化合物は歴史的に顔料などへ使われた例がありますが、強い毒性が問題となりました。美しい色と材料安全性が別問題であることを示す歴史です。"]],'EL-037-RB':[["ルビジウムの名前は赤い線から？","分光分析で深い赤色のスペクトル線が観察されたことから、ラテン語で暗赤色を意味するrubidusに由来して名付けられました。"],["原子時計にもルビジウム？","ルビジウム原子の遷移周波数を利用した原子時計は、小型化しやすく通信・測位・計測などで利用されています。"],["水と激しく反応する？","ルビジウムはアルカリ金属で非常に反応性が高く、水と激しく反応します。一般環境で直接扱う材料ではありません。"]],'IZO':[["IZOはITOと何が違う？","IZOはインジウム酸化物と亜鉛酸化物を基礎とする透明導電性酸化物です。ITOと同様に透明電極候補ですが、成膜性や曲げ特性など異なる特徴を狙えます。"],["透明な電極はなぜ必要？","ディスプレイや太陽電池では、光を通す場所にも電極が必要です。透明導電膜は『見えない配線』として光と電気を両立します。"],["薄膜の性能は酸素量でも変わる？","酸化物導電膜は酸素欠陥や組成でキャリア濃度が変化し、抵抗率と透明性のバランスも変わります。成膜条件の制御が大切です。"]],'AZO':[["AZOはインジウムを使わない透明電極？","AZOはZnOへAlを添加した透明導電膜で、希少なインジウムを使わない候補として研究・利用されています。"],["アルミを少し入れるとなぜ電気が流れやすくなる？","ZnO中のZnの一部をAlが置き換えることで自由電子が増え、導電性を高められます。添加量が多ければよいわけではなく最適化が必要です。"],["太陽電池にも使える？","光を通して電気を集める透明電極として、薄膜太陽電池などでAZOが利用・研究が進められています。"]],'GZO':[["GZOは何を添加したZnO？","GZOはZnOへガリウムを添加した透明導電性酸化物です。Gaがキャリア供給に寄与し、透明性と導電性を両立させます。"],["AZOとの違いは？","どちらもZnO系透明導電膜ですが、ドーパントがGaかAlかで成膜安定性や電気特性などが変わります。用途とプロセスで選択されます。"],["スパッタリングターゲットにもなる？","GZO焼結ターゲットを使ったスパッタリングで透明導電膜を形成できます。ターゲット組成と膜組成が必ず完全に同じになるとは限りません。"]],'FTO':[["FTOのFはフッ素？","FTOはFluorine-doped Tin Oxideで、SnO2へフッ素を添加した透明導電膜です。単体フッ素ガスを膜として使うという意味ではありません。"],["高温プロセスに比較的強い？","FTOは化学的・熱的安定性を活かし、太陽電池や電気化学デバイスの透明電極などに使われます。"],["窓ガラスにも機能膜を付けられる？","導電性や赤外線反射などの機能を持つ酸化物膜をガラスへ形成することで、単なる透明板を機能性ガラスへ変えられます。"]],'ATO':[["ATOはアンチモン入りSnO2？","ATOはSnO2へSbを添加して導電性を高めた酸化物材料です。透明導電膜や導電性粉体として利用されます。"],["透明だけでなく帯電防止にも？","導電性を持たせたATO系材料は、静電気を逃がす帯電防止コーティングなどにも利用されます。"],["アンチモンの量で性能が変わる？","ドーパント濃度はキャリア数だけでなく結晶性や散乱にも影響するため、導電性と光学特性の最適点を探す必要があります。"]],'IN2O3':[["酸化インジウムはITOの母体？","ITOは主にIn2O3へSnを添加した材料です。酸化インジウム自体もn型半導体として透明導電材料研究の基礎になります。"],["透明な酸化物が半導体になる？","酸化物は絶縁体という印象がありますが、In2O3のように電子が移動できる酸化物半導体もあります。"],["インジウム資源が課題になる？","透明電極需要に対してインジウムは副産物として得られる希少金属であり、使用量削減・回収・代替材料研究が大切です。"]],'SNO2':[["SnO2はガスセンサーにも使われる？","SnO2表面へガスが吸着すると電気抵抗が変化するため、半導体式ガスセンサーの代表材料として利用されています。"],["透明導電膜にもなる？","適切なドーピングを行ったSnO2は透明性と導電性を持ち、FTOやATOなどの母体材料になります。"],["スズ金属とは性質がまったく違う？","柔らかい金属Snに対し、SnO2は硬い酸化物セラミックスです。酸化によって電気・機械・光学特性が大きく変わります。"]],'ZNO':[["ZnOは日焼け止めにも半導体にも？","ZnOは紫外線を吸収・散乱するため日焼け止めなどに使われる一方、ワイドバンドギャップ半導体・透明導電材料としても研究が進められています。"],["酸化亜鉛は白いのに透明膜にもできる？","粉末では光を散乱して白く見えますが、十分薄く均一な膜では可視光をよく通すことができます。形態で見え方が変わります。"],["圧電性もある？","ZnOは圧電性を持ち、薄膜共振器やセンサーなどへの応用があります。光・電気・機械の性質が一つの材料の中でつながっています。"]],'GA2O3':[["β-Ga2O3は次世代パワー半導体？","非常に広いバンドギャップと高い絶縁破壊電界が期待され、高耐圧パワーデバイス材料として研究開発が進んでいます。"],["GaNやSiCより全部優れている？","高耐圧面の魅力がある一方、熱伝導性など課題もあります。半導体材料は一つの物性値だけで優劣を決められません。"],["βって何を意味する？","Ga2O3には複数の結晶相があり、β相が常温で最も安定な代表構造です。同じ化学式でも結晶構造で性質が変わります。"]],'HFO2':[["HfO2は先端CPUにも入っている？","HfO2系高誘電率材料は、微細トランジスタのゲート絶縁膜として導入され、漏れ電流を抑えながら容量を確保する技術を支えています。"],["強誘電体にもなる？","特定の組成・結晶相・膜厚条件ではHfO2系薄膜が強誘電性を示し、不揮発メモリなどへの応用が研究・実用化されています。"],["同じHfO2でも結晶相が重要？","HfO2には複数の結晶相があり、相やドーパント、応力によって電気特性が大きく変化します。"]],'ZRO2':[["ジルコニアは人工歯にも使われる？","高強度で白色、生体環境で比較的安定な安定化ジルコニアは歯科クラウンやブリッジなどに広く利用されています。"],["割れにくくする仕組みがある？","正方晶ジルコニアでは亀裂先端付近の相変態が亀裂進展を妨げる『変態強化』を利用でき、セラミックスとして高い靭性を得られます。"],["キュービックジルコニアもZrO2？","宝飾用キュービックジルコニアは安定化した立方晶ZrO2系材料です。ダイヤモンドとは化学組成が異なります。"]],'TA2O5':[["Ta2O5はコンデンサの薄い絶縁膜？","タンタルコンデンサではタンタル表面に形成される非常に薄いTa2O5膜が誘電体として働き、小型で大きな容量を得る鍵になります。"],["光学膜にも使える？","Ta2O5は比較的高い屈折率と透明性を持ち、SiO2などと組み合わせた多層光学膜に利用されます。"],["薄膜の欠陥が性能を左右する？","絶縁膜では微小欠陥や不純物が漏れ電流や信頼性へ影響します。厚さだけでなく膜質の制御が大切です。"]],'NB2O5':[["Nb2O5は光学コーティングにも？","Nb2O5は高屈折率の酸化物として、反射防止膜やフィルターなどの多層光学膜に利用されます。"],["電池材料としても研究される？","ニオブ酸化物は高速充放電や安全性を狙う負極・電極材料として研究が進められています。結晶構造や組成によって特性が異なります。"],["透明な膜でも電気特性がある？","Nb2O5は絶縁・誘電・電気化学的性質を持ち、光学だけでなく電子・エネルギー分野にも広がる材料です。"]],'AL2O3':[["サファイアもAl2O3？","宝石のサファイアとルビーは主成分が結晶性Al2O3です。微量元素の違いによって色が変わります。"],["アルミの表面にもAl2O3？","アルミニウムは空気中ですぐ薄い酸化アルミニウム皮膜を作り、内部を腐食から守ります。アルマイトではこの酸化皮膜を人工的に成長させます。"],["セラミックス基板にも使う？","アルミナは電気絶縁性、耐熱性、コストのバランスが良く、電子部品の基板や絶縁部品に広く使われます。"]],'SIO2A':[["ガラスの主役もSiO2？","一般的なガラスはSiO2を骨格とする材料です。非晶質では原子配列に長距離の周期性がなく、結晶石英とは同じSiO2でも構造が異なります。"],["半導体では絶縁膜の原点？","Si表面に高品質なSiO2膜を形成できることが、シリコン半導体技術の大きな強みとなりました。"],["透明なのに膜厚で色が見える？","SiO2薄膜は透明でも、基板上で光が干渉すると膜厚に応じた色が見えることがあります。薄膜観察の身近な手掛かりです。"]],'SIO2Q':[["石英とガラスは同じSiO2なのに何が違う？","石英は規則正しい結晶構造を持ち、石英ガラスは非晶質です。化学式が同じでも原子配列が変わると熱・光学・機械特性が変化します。"],["水晶も石英？","天然の水晶は結晶性SiO2、つまり石英です。透明な宝石と工業用圧電材料が同じ結晶につながります。"],["時計の『クオーツ』も石英？","水晶振動子は石英の圧電性を利用し、非常に安定した振動を作って時計や電子回路の基準信号に使われます。"]],'TIO2R':[["白い顔料の代表？","ルチル型TiO2は高い屈折率を持ち、光を強く散乱するため白色顔料として塗料や樹脂などに広く使われます。"],["日焼け止めにもTiO2？","微粒子TiO2は紫外線を吸収・散乱する性質を利用して日焼け止めに配合されることがあります。"],["ルチルとアナターゼは同じ化学式？","どちらもTiO2ですが結晶構造が異なります。ルチルは熱力学的に安定で、高屈折率などの特徴があります。"]],'TIO2A':[["アナターゼは光触媒で有名？","アナターゼ型TiO2は紫外光などで電子と正孔を生じ、表面反応を促進する光触媒材料として広く研究・利用されています。"],["ルチルとの違いは原子の並び方？","化学式は同じTiO2でも結晶構造が違い、バンド構造や表面反応性なども変化します。"],["光で汚れを分解できる？","光触媒表面では有機物の分解や超親水化などが起こり、防汚・環境用途へ応用されています。ただし光条件や対象物質で効果は変わります。"]],'Y2O3':[["Y2O3は蛍光体の母体にも？","Y2O3はEuなどを添加した赤色蛍光体の母体材料として使われてきました。少量の希土類添加で発光色を作れます。"],["耐プラズマ材料としても注目？","半導体製造装置ではフッ素系プラズマにさらされる部材があり、Y2O3系コーティングが耐食材料として利用されます。"],["透明セラミックスにもできる？","高純度化と微構造制御によって光を通す透明Y2O3セラミックスも研究が進められています。気孔や粒界の制御が鍵です。"]],'LA2O3':[["La2O3は光学ガラスにも関係する？","La2O3を含むランタン系ガラスは高屈折率・低分散などを狙った高性能レンズ材料に利用されます。"],["水分を吸いやすい？","La2O3は水分やCO2と反応しやすく、保管・取り扱い条件によって水酸化物や炭酸塩を形成することがあります。"],["高誘電率材料としても？","La2O3は高い誘電率を持つ酸化物として電子材料研究の対象ですが、界面安定性など実用上の課題もあります。"]],'TIB2':[["TiB2は非常に硬い？","TiB2は高硬度、高融点、電気伝導性を持つ導電性セラミックスで、耐摩耗・高温用途に使われます。"],["セラミックスなのに電気を通す？","TiB2は金属的な結合成分を持ち、一般的な絶縁セラミックスとは異なり良好な導電性を示します。"],["アルミ製錬にも関係する？","溶融アルミに対する濡れ性や耐食性を利用し、アルミ電解・鋳造関連部材や結晶粒微細化用途で研究・利用されます。"]],'ZRB2':[["ZrB2は超高温セラミックス？","ZrB2は高融点と高い熱伝導性を持ち、極超音速機や宇宙機の高温部材候補として研究が進められています。"],["酸化対策が重要？","高温空気中では酸化するため、SiCとの複合化などで保護性の高い酸化層を形成させる設計が研究が進められています。"],["硬いだけでは宇宙材料にならない？","熱衝撃、酸化、加工性、接合など多くの特性が必要で、複合材料として総合設計されます。"]],'HFB2':[["HfB2はさらに高温向け？","HfB2は非常に高い融点を持つ超高温セラミックスで、ZrB2と並び極端な熱環境向け材料として研究が進められています。"],["重いセラミックス？","Hfは原子量が大きいためHfB2は比較的高密度です。耐熱性だけでなく重量も用途選定の要素になります。"],["SiCと組み合わせる理由は？","SiCを複合化すると高温酸化時に保護性のあるガラス状層形成を助け、耐酸化性改善を狙えます。"]],'LAB6':[["電子を出しやすいセラミックス？","LaB6は加熱すると電子を効率よく放出できるため、電子顕微鏡などの熱電子源として利用されます。"],["タングステンフィラメントとの違いは？","LaB6電子源は高輝度で長寿命を得やすい一方、高い真空度など適切な装置条件が必要です。"],["紫色の結晶になる？","高純度LaB6は特徴的な紫色〜紫黒色の外観を示すことがあり、機能性セラミックスとして印象的な材料です。"]],'GAAS':[["GaAsはなぜ高速通信に使われる？","GaAsは電子移動度が高く、高周波で動作するトランジスタや増幅器に適しています。スマートフォンの無線回路などにも使われます。"],["光を出す半導体？","GaAsは直接遷移型半導体で、LEDやレーザーダイオードなど発光デバイスに向いています。"],["Siより全部優秀ではない？","GaAsは高周波・光用途に強い一方、ウェハコストや機械的性質、製造基盤ではSiに利点があります。用途で使い分けます。"]],'INP':[["InPは光ファイバー通信と相性がいい？","InP系化合物半導体は光ファイバー通信で使われる1.3〜1.55µm付近のレーザーや受光素子を作る基板として大切です。"],["レーザーと高速トランジスタの両方？","InPは光デバイスだけでなく高電子移動度を活かした高速・高周波電子デバイスにも利用されます。"],["インジウム資源も関係する？","InPは高性能ですがInは希少金属です。性能だけでなく、コストや供給性まで含めて選ぶ必要があります。"]],'INAS':[["InAsは赤外線を見る材料？","InAsはバンドギャップが小さく、赤外線検出器やセンサー材料として利用・研究が進められています。"],["電子が非常に動きやすい？","InAsは高い電子移動度を持ち、高速デバイスや量子デバイス研究で大切です。"],["ナノワイヤでも注目？","InAsナノワイヤは量子輸送や超伝導体との接合など、次世代量子デバイス研究で広く扱われています。"]],'GAP':[["GaPは何色のLEDに関係する？","GaPは赤・緑系LEDの歴史で重要な材料で、ドーパントや構造を工夫して発光に利用されてきました。"],["間接遷移型でも光る？","GaPは間接遷移型半導体ですが、不純物準位などを利用することで発光デバイスに使われます。"],["GaAsとは化学式が一文字違うだけ？","AsをPへ変えるとバンドギャップや格子定数などが変わり、用途も大きく変化します。化合物半導体は組成設計が大切です。"]],'INSB':[["InSbは赤外線センサーに使う？","InSbは非常に小さなバンドギャップを持ち、中赤外域の高感度検出器として利用されます。"],["電子移動度がとても高い？","InSbは室温でも非常に高い電子移動度を示す半導体として知られ、高速・磁気センサー研究でも大切です。"],["冷やして使うことがある？","高感度赤外線検出では熱雑音を減らすため検出器を冷却して使うことがあります。材料性能と装置設計が一体です。"]],'GASB':[["GaSbは赤外線レーザーの仲間？","GaSb系材料は中赤外域のレーザーや受光素子に利用され、ガスセンシングなどへの応用があります。"],["InAsと組み合わせると？","GaSb/InAsなどのヘテロ構造は特殊なバンド配置を持ち、赤外線検出や量子デバイス研究で利用されます。"],["半導体は一枚の材料だけで作る？","実際の化合物半導体デバイスでは異なる材料を原子レベルで積層し、バンド構造を設計することが多くあります。"]],'MOS2':[["MoS2は原子数層まで薄くできる？","MoS2は層状物質で、層間結合が弱いため単層まで薄くできます。単層では電子構造も変わり、二次元半導体として注目されます。"],["潤滑剤にも半導体にもなる？","バルクMoS2は層が滑りやすく固体潤滑剤として使われる一方、薄層では半導体デバイス研究の主役になります。"],["真空で潤滑に強い？","MoS2は油が使いにくい真空・宇宙環境の固体潤滑膜として利用されます。ただし湿度など環境で摩擦特性が変わります。"]],'WS2':[["WS2も二次元材料？","WS2はMoS2と同じ遷移金属ダイカルコゲナイドの層状材料で、単層化すると特徴的な光・電子特性を示します。"],["固体潤滑膜にも使える？","層状構造が滑りやすいため、WS2も低摩擦コーティングや固体潤滑材として利用されます。"],["MoS2との違いは？","似た構造でもWとMoの違いでバンドギャップ、スピン軌道相互作用、耐熱性などが変わります。"]],'ZNS':[["ZnSは光る材料？","ZnSは蛍光体の母体として古くから使われ、Cuなどの添加元素によって発光色を調整できます。"],["夜光塗料にも関係した？","歴史的な発光塗料ではZnS系蛍光体が放射線や光で励起されて発光する仕組みが利用されました。"],["透明な光学材料にも？","高純度ZnSは赤外線を通す窓材としても利用されます。粉末蛍光体とは全く違う形態です。"]],'ZNSE':[["ZnSeは赤外線レンズに使う？","ZnSeは可視の一部から赤外まで広い透過域を持ち、CO2レーザー用レンズや赤外光学窓に広く使われます。"],["黄色っぽいレンズの正体？","ZnSe光学部品は特徴的な黄〜橙色に見えることがあります。可視光での外観と赤外透過性能が共存します。"],["高出力レーザーでは表面も重要？","吸収や表面欠陥がわずかでも発熱につながるため、高出力レーザー用では高純度化と高品質コーティングが大切です。"]],'CDS':[["CdSは黄色い半導体？","CdSは黄色系の外観を持つ化合物半導体で、光を受けると電気伝導が変わる光導電材料として知られます。"],["昔の光センサーにも？","CdSセルは明るさで抵抗値が変わるため、街灯の自動点灯など光センサーに広く使われてきました。"],["カドミウム規制の影響は？","Cdを含むため環境・安全規制の対象となり、用途によって代替材料への移行が進んでいます。"]],'CDSE':[["CdSeは量子ドットで有名？","CdSeナノ結晶は粒径によって発光色を調整できる代表的な量子ドット材料です。量子閉じ込め効果を視覚的に示します。"],["粒の大きさで色が変わる？","ナノメートルサイズでは電子状態が粒径に依存し、小さい粒ほど一般に短波長側へ発光が移ります。"],["高性能でも安全管理が必要？","Cdを含むため、研究・製造・廃棄では適切な安全・環境管理が必要です。"]],'BI2TE3':[["体温差で発電できる材料？","Bi2Te3系は室温付近で高い熱電性能を持ち、温度差から電圧を生む発電や電流で熱を移動させるペルチェ冷却に使われます。"],["動く部品なしで冷やせる？","ペルチェ素子はコンプレッサーのような可動部なしで冷却できます。小型冷却器や温度制御に便利ですが効率面の制約もあります。"],["材料は熱を通さない方がいい？","熱電材料では電気は通しやすく、熱は通しにくいという相反する性質が望まれます。性能指数を高める材料設計が大切です。"]],'SB2TE3':[["Sb2Te3も熱電材料？","Sb2Te3はBi2Te3系と組み合わせるp型熱電材料として、室温付近のペルチェ素子などに使われます。"],["トポロジカル絶縁体としても？","Sb2Te3は表面に特殊な電子状態を持つトポロジカル絶縁体の代表材料の一つとして基礎研究でも大切です。"],["同じ材料に二つの顔？","熱電変換という実用的性質と、量子物性研究の対象という二つの側面を持つ材料です。"]],'GST':[["GSTはDVDやメモリと関係する？","Ge-Sb-Te系GSTは結晶状態と非晶質状態で光学・電気特性が大きく変わる相変化材料です。光ディスクや相変化メモリに利用されます。"],["一瞬で結晶とガラス状態を切り替える？","短い加熱パルスの温度・冷却速度を制御し、結晶化または急冷非晶質化させて情報を記録します。"],["データを電源なしで保持できる？","相状態そのものが残るため、不揮発メモリとして電源を切っても情報を保持できます。"]],'GETE':[["GeTeも相変化材料？","GeTeは結晶と非晶質で電気・光学特性が変わり、GSTなど相変化材料の基礎となる重要な化合物です。"],["熱で情報を書き換える？","局所的な加熱と冷却速度を制御して相状態を切り替え、抵抗差などを情報として利用できます。"],["熱電材料としても研究される？","GeTeは高温域の熱電材料としても研究され、ドーピングや欠陥制御で性能向上が検討されています。"]]};

     ['金箔って、食べても大丈夫？','ケーキや日本酒にのっている金箔を見ると、「金属なのに食べて大丈夫？」と少し気になります。食品用として作られた金箔に使われる金は、化学的にとても反応しにくく、消化管からもほとんど吸収されません。そのため、通常の食品用途では体内を通過して排出されると考えられています。ただし、これは食品用として製造・管理された金箔の話で、工芸用や装飾用の金箔まで食べてよいという意味ではありません。'],
