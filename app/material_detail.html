<script>
(function(){
 const all=(window.EMD_DATA&&window.EMD_DATA.materials)||[], params=new URLSearchParams(location.search), id=params.get('id')||params.get('material'), app=document.getElementById('app');
 const m=all.find(x=>x.id===id)||all[0];
 const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
 const textOrMissing=v=>{const t=String(v??'').trim();return t?esc(t):'<span class="missing-value">未登録</span>'};
 const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
 if(!m){app.innerHTML='<div class="card">材料データが見つかりません。</div>';return}
 document.title=(m.japanese||m.name)+' - MonoBase';
 function addRecent(){let a=get('epaRecentMaterials').filter(x=>x.id!==m.id);a.unshift({id:m.id,name:m.name,japanese:m.japanese,formula:m.formula});set('epaRecentMaterials',a.slice(0,8))}
 function extRefs(x){
   const q=encodeURIComponent(x.japanese||x.english||x.formula||x.id), eq=encodeURIComponent(x.english||x.japanese||x.formula||x.id);
   /* External reference policy (Ver.7.2 audit):
      検索結果が出ない/別物へ飛ぶリスクを避けるため、全材料へ同じ外部検索を
      機械的に表示しない。材料タイプ別に適したリンクだけを表示する。 */
   const academic=[];
   const reference=[];
   const isElement=/^EL-\d{3}-/.test(x.id);

   /* RSCは元素専用。登録済みの元素個別ページを優先。 */
   if(isElement){
     const allSrc=[x.transport_source_url,x.property_source_url,
       x.source_current&&x.source_current.url,x.source_a&&x.source_a.url,x.source_b&&x.source_b.url].filter(Boolean);
     const rscDirect=allSrc.find(u=>/periodic-table\.rsc\.org\/element\//i.test(u));
     if(rscDirect)academic.push(['R','RSC','元素個別ページ',rscDirect]);
   }

   /* PubChemは単一化学種として検索しやすい材料だけに限定。 */
   const noPubChem=new Set([
     'ITO','IGZO','IZO','AZO','GZO','FTO','ATO','SCALN','GST',
     'COFEB','NIFE','COFE','ALSI','ALSICU','TIW','MOW'
   ]);
   if(!isElement&&!noPubChem.has(x.id)&&(x.formula||x.english)){
     const pcq=encodeURIComponent(x.formula||x.english);
     academic.push(['P','PubChem','化学種検索：'+(x.formula||x.english),
       'https://pubchem.ncbi.nlm.nih.gov/#query='+pcq]);
   }
   if(x.id==='ITO'){
     academic.push(['P','PubChem','Indium Tin Oxide 個別ページ',
       'https://pubchem.ncbi.nlm.nih.gov/compound/Indium-tin-oxide']);
   }

   /* Wikipediaスマートリンク */
   const wikiMap={
    ITO:['https://en.wikipedia.org/wiki/Indium_tin_oxide','英語版：Indium tin oxide'],
    IGZO:['https://en.wikipedia.org/wiki/Indium_gallium_zinc_oxide','英語版：Indium gallium zinc oxide'],
    IZO:['https://en.wikipedia.org/wiki/Indium_tin_oxide#Amorphous_indium%E2%80%93zinc_oxide','英語版：Indium zinc oxide 関連節'],
    AZO:['https://ja.wikipedia.org/w/index.php?search='+encodeURIComponent('アルミニウム添加酸化亜鉛 AZO'),'日本語版検索：AZO'],
    GZO:['https://ja.wikipedia.org/w/index.php?search='+encodeURIComponent('ガリウム添加酸化亜鉛 GZO'),'日本語版検索：GZO'],
    FTO:['https://ja.wikipedia.org/w/index.php?search='+encodeURIComponent('フッ素添加酸化スズ FTO'),'日本語版検索：FTO'],
    ATO:['https://ja.wikipedia.org/w/index.php?search='+encodeURIComponent('アンチモン添加酸化スズ ATO'),'日本語版検索：ATO'],
    IN2O3:['https://en.wikipedia.org/wiki/Indium(III)_oxide','英語版：Indium(III) oxide'],
    SNO2:['https://en.wikipedia.org/wiki/Tin(IV)_oxide','英語版：Tin(IV) oxide'],
    GA2O3:['https://en.wikipedia.org/wiki/Gallium(III)_oxide','英語版：Gallium(III) oxide'],
    HFO2:['https://en.wikipedia.org/wiki/Hafnium(IV)_oxide','英語版：Hafnium(IV) oxide'],
    ZRO2:['https://en.wikipedia.org/wiki/Zirconium_dioxide','英語版：Zirconium dioxide'],
    TA2O5:['https://en.wikipedia.org/wiki/Tantalum_pentoxide','英語版：Tantalum pentoxide'],
    NB2O5:['https://en.wikipedia.org/wiki/Niobium_pentoxide','英語版：Niobium pentoxide'],
    AL2O3:['https://ja.wikipedia.org/wiki/%E9%85%B8%E5%8C%96%E3%82%A2%E3%83%AB%E3%83%9F%E3%83%8B%E3%82%A6%E3%83%A0','日本語版：酸化アルミニウム'],
    SIO2A:['https://ja.wikipedia.org/wiki/%E4%BA%8C%E9%85%B8%E5%8C%96%E3%82%B1%E3%82%A4%E7%B4%A0','日本語版：二酸化ケイ素'],
    SIO2Q:['https://ja.wikipedia.org/wiki/%E7%9F%B3%E8%8B%B1','日本語版：石英'],
    TIO2R:['https://ja.wikipedia.org/wiki/%E4%BA%8C%E9%85%B8%E5%8C%96%E3%83%81%E3%82%BF%E3%83%B3','日本語版：二酸化チタン'],
    TIO2A:['https://ja.wikipedia.org/wiki/%E4%BA%8C%E9%85%B8%E5%8C%96%E3%83%81%E3%82%BF%E3%83%B3','日本語版：二酸化チタン'],
    SCALN:['https://en.wikipedia.org/wiki/Scandium_aluminium_nitride','英語版：Scandium aluminium nitride'],
    GST:['https://en.wikipedia.org/wiki/GeSbTe','英語版：GeSbTe'],
