<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
<title id="title">真空ポンプが気体を外へ運ぶ基本イメージ</title>
<desc id="desc">容器内の気体を取り込み、出口側へ運び、外へ出す三段階を縦方向に示す概念図</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f82b5"/></marker></defs>
<g font-family="sans-serif" fill="#16324f">
  <text x="180" y="30" text-anchor="middle" font-size="21" font-weight="700">容器内の気体</text>
</g>
<rect x="92" y="48" width="176" height="118" rx="20" fill="#eef7fc" stroke="#6f9bb5" stroke-width="4"/>
<g fill="#2f82b5"><circle cx="130" cy="83" r="6"/><circle cx="168" cy="123" r="6"/><circle cx="220" cy="80" r="6"/><circle cx="232" cy="137" r="6"/><circle cx="138" cy="142" r="6"/><circle cx="198" cy="106" r="6"/></g>
<g font-family="sans-serif" fill="#16324f" font-size="21" font-weight="700" text-anchor="middle">
  <text x="180" y="208">① 取り込む</text>
  <text x="180" y="388">② 出口側へ運ぶ</text>
  <text x="180" y="568">③ 外へ出す</text>
</g>
<line x1="180" y1="226" x2="180" y2="286" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="152" cy="321" r="6"/><circle cx="180" cy="336" r="6"/><circle cx="208" cy="321" r="6"/></g>
<line x1="180" y1="406" x2="180" y2="466" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="152" cy="501" r="6"/><circle cx="180" cy="516" r="6"/><circle cx="208" cy="501" r="6"/></g>
<line x1="180" y1="586" x2="180" y2="646" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="145" cy="690" r="6"/><circle cx="180" cy="674" r="6"/><circle cx="215" cy="690" r="6"/></g>
<text x="180" y="736" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d7184">気体が外へ移動していく基本イメージ</text>
</svg>
