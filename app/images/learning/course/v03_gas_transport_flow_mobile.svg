<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">真空ポンプが気体を外へ運ぶ基本イメージ</title>
<desc id="desc">容器内の気体を取り込み、出口側へ運び、外へ出す三段階を縦方向に示す概念図</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f82b5"/></marker></defs>
<g font-family="sans-serif" fill="#16324f">
  <text x="180" y="26" text-anchor="middle" font-size="19" font-weight="700">容器内の気体</text>
</g>
<rect x="100" y="40" width="160" height="102" rx="18" fill="#eef7fc" stroke="#6f9bb5" stroke-width="4"/>
<g fill="#2f82b5"><circle cx="132" cy="72" r="5.5"/><circle cx="164" cy="107" r="5.5"/><circle cx="211" cy="70" r="5.5"/><circle cx="225" cy="118" r="5.5"/><circle cx="140" cy="122" r="5.5"/><circle cx="193" cy="92" r="5.5"/></g>
<g font-family="sans-serif" fill="#16324f" font-size="19" font-weight="700" text-anchor="middle">
  <text x="180" y="180">① 取り込む</text>
  <text x="180" y="300">② 出口側へ運ぶ</text>
  <text x="180" y="420">③ 外へ出す</text>
</g>
<line x1="180" y1="194" x2="180" y2="228" stroke="#2f82b5" stroke-width="5" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="156" cy="256" r="5.5"/><circle cx="180" cy="270" r="5.5"/><circle cx="204" cy="256" r="5.5"/></g>
<line x1="180" y1="314" x2="180" y2="348" stroke="#2f82b5" stroke-width="5" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="156" cy="376" r="5.5"/><circle cx="180" cy="390" r="5.5"/><circle cx="204" cy="376" r="5.5"/></g>
<line x1="180" y1="434" x2="180" y2="468" stroke="#2f82b5" stroke-width="5" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="156" cy="500" r="5.5"/><circle cx="180" cy="514" r="5.5"/><circle cx="204" cy="500" r="5.5"/></g>
</svg>
