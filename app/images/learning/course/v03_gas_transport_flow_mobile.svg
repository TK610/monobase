<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" role="img" aria-labelledby="title desc">
<title id="title">真空ポンプが気体を外へ運ぶ基本イメージ</title><desc id="desc">容器内の気体を取り込み、出口側へ運び、外へ出す三段階を縦方向に示す概念図</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2f82b5"/></marker></defs>
<text x="180" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">容器内の気体</text>
<rect x="85" y="54" width="190" height="130" rx="22" fill="#eef7fc" stroke="#6f9bb5" stroke-width="4"/>
<g fill="#2f82b5"><circle cx="125" cy="92" r="7"/><circle cx="170" cy="130" r="7"/><circle cx="220" cy="88" r="7"/><circle cx="235" cy="145" r="7"/><circle cx="135" cy="150" r="7"/><circle cx="198" cy="115" r="7"/></g>
<text x="180" y="225" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">① 取り込む</text><line x1="180" y1="242" x2="180" y2="300" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="150" cy="330" r="7"/><circle cx="180" cy="345" r="7"/><circle cx="210" cy="330" r="7"/></g>
<text x="180" y="400" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">② 出口側へ運ぶ</text><line x1="180" y1="417" x2="180" y2="475" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="150" cy="505" r="7"/><circle cx="180" cy="520" r="7"/><circle cx="210" cy="505" r="7"/></g>
<text x="180" y="575" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">③ 外へ出す</text><line x1="180" y1="592" x2="180" y2="642" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="145" cy="675" r="7"/><circle cx="180" cy="662" r="7"/><circle cx="215" cy="675" r="7"/></g>
</svg>