<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" role="img" aria-labelledby="title desc">
<title id="title">真空ポンプが気体を外へ運ぶ基本イメージ</title>
<desc id="desc">容器内の気体を取り込み、出口側へ運び、外へ出す三段階を単純化した概念図</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2f82b5"/></marker></defs>
<g font-family="sans-serif" fill="#16324f">
  <text x="125" y="42" text-anchor="middle" font-size="22" font-weight="700">容器内の気体</text>
  <text x="360" y="68" text-anchor="middle" font-size="21" font-weight="700">① 取り込む</text>
  <text x="660" y="68" text-anchor="middle" font-size="21" font-weight="700">② 出口側へ運ぶ</text>
  <text x="960" y="68" text-anchor="middle" font-size="21" font-weight="700">③ 外へ出す</text>
</g>
<rect x="20" y="72" width="210" height="150" rx="24" fill="#eef7fc" stroke="#6f9bb5" stroke-width="4"/>
<g fill="#2f82b5">
  <circle cx="68" cy="112" r="7"/><circle cx="116" cy="158" r="7"/><circle cx="176" cy="104" r="7"/><circle cx="195" cy="183" r="7"/><circle cx="82" cy="192" r="7"/><circle cx="150" cy="136" r="7"/>
</g>
<!-- equal-length stage arrows -->
<line x1="270" y1="150" x2="420" y2="150" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="468" cy="132" r="7"/><circle cx="492" cy="164" r="7"/><circle cx="516" cy="142" r="7"/></g>
<line x1="570" y1="150" x2="720" y2="150" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="768" cy="132" r="7"/><circle cx="792" cy="164" r="7"/><circle cx="816" cy="142" r="7"/></g>
<line x1="870" y1="150" x2="1020" y2="150" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<g fill="#2f82b5"><circle cx="1068" cy="128" r="7"/><circle cx="1100" cy="158" r="7"/><circle cx="1133" cy="136" r="7"/><circle cx="1082" cy="192" r="7"/></g>
</svg>
