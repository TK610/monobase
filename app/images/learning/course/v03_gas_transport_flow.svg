<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" role="img" aria-labelledby="title desc">
<title id="title">真空ポンプが気体を外へ運ぶ基本イメージ</title>
<desc id="desc">容器内の気体を取り込み、出口側へ運び、外へ出す三段階を単純化した概念図</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2f82b5"/></marker>
</defs>
<rect x="22" y="72" width="210" height="150" rx="24" fill="#eef7fc" stroke="#6f9bb5" stroke-width="4"/>
<text x="127" y="48" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">容器内の気体</text>
<g fill="#2f82b5">
<circle cx="70" cy="115" r="7"/><circle cx="118" cy="158" r="7"/><circle cx="175" cy="105" r="7"/><circle cx="195" cy="184" r="7"/><circle cx="83" cy="193" r="7"/><circle cx="151" cy="137" r="7"/>
</g>
<line x1="235" y1="147" x2="345" y2="147" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<text x="290" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">① 取り込む</text>
<g fill="#2f82b5"><circle cx="382" cy="132" r="7"/><circle cx="405" cy="162" r="7"/><circle cx="430" cy="141" r="7"/></g>
<line x1="455" y1="147" x2="665" y2="147" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<text x="560" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">② 出口側へ運ぶ</text>
<g fill="#2f82b5"><circle cx="700" cy="132" r="7"/><circle cx="724" cy="162" r="7"/><circle cx="748" cy="141" r="7"/></g>
<line x1="775" y1="147" x2="930" y2="147" stroke="#2f82b5" stroke-width="6" marker-end="url(#arrow)"/>
<text x="850" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">③ 外へ出す</text>
<g fill="#2f82b5"><circle cx="967" cy="126" r="7"/><circle cx="1000" cy="154" r="7"/><circle cx="1032" cy="134" r="7"/><circle cx="982" cy="184" r="7"/></g>
</svg>
